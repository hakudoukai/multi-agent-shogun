# 博道会医療法人 multi-agent-shogun 設定 (Task M C案 shim統合版)
# yohey-w/multi-agent-shogun 公式骨格 + DD-146 R1-R4 博道会魂

language: ja
shell: bash

# 役職定義 (§18 PC×アカウント配置ルール準拠 — CLAUDE.md §18.1)
# 旧体制 persona alias (fukuincho / kuro / kouchan / sakura / 副医院長) は §18 移行で
# 廃止。役名 = §18 agent ID をそのまま使用 (shogun / karo / gunshi / ashigaru1-3 /
# ashigaru5-8)。ashigaru4 = 欠番 (PC 境界の視覚的区切り)。
# Reference: shim/hakudokai/_section18_roles.py (single source of truth)

# CLI割当 (公式: claude/codex/copilot/kimi、gemini暫定alias)
# §18 役名で entry を持つ (旧 persona 名は廃止)
cli:
  default: claude
  agents:
    nobunaga: claude       # 技術キー(表示名=将軍main。戦国名は廃止・理事長令2026-07-19)
    hideyoshi: claude     # 技術キー(表示名=家老main。戦国名は廃止)
    ieyasu: claude         # 技術キー(表示名=軍師main。戦国名は廃止)
    karo-second: claude         # SecondPC 家老 — Phase 1 新設
    ashigaru1: claude       # MainPC 通常
    ashigaru2: claude       # MainPC 通常
    ashigaru3: claude       # MainPC 非常時 +1
    ashigaru5: claude       # SecondPC 通常
    ashigaru6: claude       # SecondPC 通常
    ashigaru7: claude       # SecondPC 通常
    ashigaru8: claude       # SecondPC 非常時 +1
    # ── third_pc 艦隊 (工程1 GO-1 apply 2026-07-09・a3-3草案由来) ──
    shogun-third: claude
    karo-third: claude
    ashigaru-third-1: claude
    ashigaru-third-2: claude
    ashigaru-third-3: claude
    ashigaru-third-4: claude
    ashigaru-third-5: claude
    ashigaru-third-7: claude
    gunshi-third: codex        # 第三者監査系統(cli≠claude)
    commander-third: claude
    # ── 管理職 (正本§4登場役職・pc配置は registry 参照) ──
    iincho: claude
    kenshu_kacho: claude
    kenshu_bucho: claude
    hermes2: claude
    # ── mac_pc 艦隊 (b3bbc656 9/9着席・4th-PC正式canon化は別ゲート) ──
    shogun-mac: claude
    karo-mac: claude
    ashigaru-mac-1: claude
    ashigaru-mac-2: claude
    ashigaru-mac-3: claude
    ashigaru-mac-4: claude
    ashigaru-mac-5: claude
    ashigaru-mac-6: claude
    ashigaru-mac-7: claude
    gunshi-mac: claude
    gakushu-bucho: codex       # ChatGPT版学習部長。modelは下記gpt-5.6-sol正本
  audit:
    primary: codex
    secondary: gemini   # cli_adapter.sh shim alias 経由 (Phase B精査予定)

# 家老4席 Fable 5 テスト切替 (理事長GO・委員長発注 hs_230295aa seq115932・2026-07-10)
# get_agent_model() 第2優先 lookup (models.{agent_id})。テスト終了時は本節削除で opus 既定へ復帰。
models:
  shogun: claude-fable-5
  shogun-third: claude-fable-5
  shogun-second: claude-fable-5
  shogun-mac: claude-fable-5
  nobunaga: claude-fable-5
  gakushu-bucho: gpt-5.6-sol
  karo-third: claude-fable-5
  karo-second: claude-fable-5
  karo-mac: claude-fable-5
  hideyoshi: claude-fable-5   # MainPC 家老 (§18 旧名entry現存のため併記)
  karo: claude-fable-5        # agent_id=karo 直参照 launcher 互換

