# エスカレーション設定
escalation:
  L3b_codex_consultation: true
  L4_ntfy_notification: true
  L4_approval_timeout: 1800
  L4_max_reminders: 3
  safety_mode_threshold_hours: 24

# 監査スケジュール
audit_schedule:
  daily: "06:00"
  weekly: "Sunday 21:00"
  on_commit_paths:
    - shim/hakudokai/
    - instructions/
    - .claude/settings.json
    - CLAUDE.md

# Supabase連携 (~/.hakudokai/env から流用)
supabase:
  env_file: ~/.hakudokai/env
  project_id: pxvnhkiqyxkejzivspde
  pc_handshake_required: true
  rls_enforce: true

# PC-agent mapping (クロスPC配信用)
# agent が所属するPCを定義。別PCのagentへの inbox_write は Supabase経由で配信。
# 2026-05-06 §18 PC × アカウント配置ルール準拠 (CLAUDE.md §18.1):
#   MainPC (sasebo@sasebo.or.jp): shogun + karo + gunshi + ashigaru1+2 [+3 非常時]
#   SecondPC (hakudoukai@gmail.com): ashigaru5+6+7 [+8 非常時]
#   足軽4 = 欠番 (PC 境界の視覚的区切り)
# 注: ashigaru3 は非常時のみ起動 (= ~/.openclaw/enable_ashigaru3 フラグ)、
#     PC 配信先としては MainPC に属するため main_pc.agents に保持。
#     ashigaru8 も同様の理由で second_pc.agents に保持。
pc_mapping:
  main_pc:
    agents: [nobunaga, hideyoshi, ieyasu, ashigaru1, ashigaru2, ashigaru3]
    is_local: true
    pc_id: main_pc
  second_pc:
    agents: [karo-second, ashigaru5, ashigaru6, ashigaru7, ashigaru8]
    supabase_bridge: true
    pc_id: second_pc
  kuro_desktop:
    agents: [kuro_desktop]
    supabase_bridge: true
    pc_id: kuro_desktop
  # ★差配1 (1a) 副院長殿差配 835ea85d (理事長承認 D-lane、FKI-CANON-GUARDIAN-01)★:
  #   fukuincho_pc を pc_mapping に新規追加。これで inbox_write.sh の cross-PC bridge
  #   resolve が target=fukuincho を解決可能化、cross-PC INSERT skip 防止 (phantom 恒久根治)。
  #   暫定回避策「fukuincho 宛は直接 curl 固定」が本登録で不要化される。
  #   commander/third_pc 配置の登録は別 task 起票要 (副医院長正本守護承認案件)。
  #   (1b) 廃止 persona 名 (nobunaga/hideyoshi/ieyasu/legacy-second-karo/kuro_desktop) の現行役職名是正
  #   は本 PR scope 外、副院長殿御差配仰ぐ正本守護承認案件として継続。
  # ★Blocker B 根治 (副院長令 680484f0、理事長承認、push 凍結中ゆえ実機反映のみ commit なし)★:
  #   key + pc_id を fukuincho_pc → fukuincho に変更。to_pc='fukuincho' (CHECK 制約 allowlist 既存値) で
  #   bridge INSERT 成功化、HTTP 23514 / inbox_write 21s timeout 根治。
  fukuincho:
    agents: [fukuincho]
    supabase_bridge: true
    pc_id: fukuincho
  third_pc:
    agents: [shogun-third, karo-third, ashigaru-third-1, ashigaru-third-2,
             ashigaru-third-3, ashigaru-third-4, ashigaru-third-5, ashigaru-third-7,
             gunshi-third, commander-third,
             iincho]
    is_local: true
    pc_id: third_pc
  mac_pc:
    agents: [shogun-mac, karo-mac, ashigaru-mac-1, ashigaru-mac-2, ashigaru-mac-3,
             ashigaru-mac-4, ashigaru-mac-5, ashigaru-mac-6, ashigaru-mac-7,
             gunshi-mac, gakushu-bucho]
    supabase_bridge: false
    ssh_direct: true
    pc_id: mac_pc

# tmux構成 (公式準拠)
tmux:
  sessions:
    - name: shogun
      windows: [main]
    - name: multiagent
      windows: [agents]
    - name: shogun-third
      windows: [shogun]
    - name: multiagent-third
      windows: [agents]
    - name: commander-third
      windows: [CommanderHermes]
