findings:
  - severity: high
    perspective: 1_functional
    issue: "staged-residual-check cannot detect the original failure mode under normal pre-commit usage. pre-commit passes the staged filenames to the hook, and the script defines those filenames as commit_set; staged_set - commit_set is therefore normally empty even when unrelated staged files are present."
    evidence:
      - ".pre-commit-config.yaml has pass_filenames: true for staged-residual-check."
      - "scripts/lint/check_staged_residual.sh builds commit_set from \"$@\" and staged_set from git diff --cached --name-only."
    recommendation: "Use an explicit allowlist/manifest for the current task commit, or a commit wrapper that passes intended files only. Static tests must include a negative fixture where unrelated staged files cause exit 1."

  - severity: high
    perspective: 8_ops
    issue: "The report claims completion, but its own fields still say AC5 pending_user_sashihai, commit_3 SHA TBD, and push_plan pending. This conflicts with the inbox claim that e062f63/9676222/651efcf are complete."
    evidence:
      - "queue/reports/ashigaru2_subtask_cmd020_scope_contamination_prevention_inline_batch_commit_hook_report.yaml contains commit_3 sha: TBD_SHA_3."
      - "Same report contains AC5: pending_user_sashihai and push_plan status: pending_user_sashihai."
    recommendation: "Backfill the final report after commit/push, or issue a corrected report with actual commit_3 hash and push status."

  - severity: medium
    perspective: 9_doc
    issue: "docs/scope_contamination_prevention.md describes the hook as pre-commit-msg stage, but .pre-commit-config.yaml registers it at pre-commit."
    recommendation: "Align the doc with the actual hook stage, or move implementation to the documented stage."

  - severity: medium
    perspective: 6_test
    issue: "The 5 static tests validate presence of anchors but do not test hook behavior with a residual staged file scenario."
    recommendation: "Add behavioral tests for no residual, residual present, and no-arg graceful skip."

