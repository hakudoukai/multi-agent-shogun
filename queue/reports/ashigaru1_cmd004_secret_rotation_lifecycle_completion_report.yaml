design_decisions:
  - "本能寺戒め: RotationHealth は fingerprint=sha256[:16] のみ、raw secret は alert/log/DB/endpoint response いずれにも絶対含まない。test_failure_alert_does_not_leak_raw_secret で機械担保。"
  - "fail-closed 設計: ADMIN_API_TOKEN env 未設定時 endpoint は 503 で全 deny、本能寺戒め整合。timing attack 防御は hmac.compare_digest で constant-time compare。"
  - "adapter ABC 設計: get_health() は purely-readonly、revoke_expired() の default は no-op (= manual secret 用)。auto_supported=True/False で worker invoke 可否を制御、副作用境界を明確化。"
  - "cross-channel 隔離: alert は RecipientType.ADMIN 限定、NtfyAdapter.supports() で patient/guardian reject (= ashigaru3 §5-3 整合)、患者向け配信と物理層で分離。"
  - "severity 自動選択: rotation_failed/grace_expired → EMERGENCY (= quiet_hours bypass)、grace_expiring/rotation_due → HIGH。運用 incident は時間問わず即時通知。"
  - "ashigaru3 既 NotificationFacade + MetricsRegistry を import 経由で再利用、独立 facade / registry 起案せず (= duplicate 回避)。ashigaru4 scheduled_delete_worker pattern を踏襲 (= 純粋関数 + entry + dry-run + env gate)。"
  - "VAPID adapter は schema 差異 (= grace_until field 不在) を deprecated_at + 14日 固定 で対応、ashigaru3 既 runbook §2-3 整合。"
  - "Manual adapter は ANTHROPIC / Supabase / ntfy auth 用、status='manual_only' 固定で観測性 dashboard 上「自動化対象外」を明示、根本治療原則 (5) 代替永続記録に整合。"
  - "inline batch commit 規範: 6 phase 即 commit (= dfd4f8a5/231b7d32/a1d0378f/63df269a/536320f4/21f6218c)、累計 +1561 行を分割、前々 task 17:18 reset 級 incident でも 1 phase 分以下しか失わない構造を再度実証。"

