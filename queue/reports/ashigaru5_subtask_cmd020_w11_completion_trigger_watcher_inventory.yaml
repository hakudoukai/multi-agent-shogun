# ───────────────────────────────────────────────
# 隣接既実装 (= Anti-Dup 比較対象、改修禁、参照のみ)
# ───────────────────────────────────────────────
adjacent_existing_workers:
  - component_id: inbox_watcher
    file_path: scripts/inbox_watcher.sh
    trigger_type: event_based
    cadence: "inotifywait file change"
    overlap_with_w11_trigger: none
    rationale: "inotifywait は inbox YAML file change を起点とする event-driven、本 W11 trigger は SC 上 Supabase external state を起点とする scheduled query。event source が異なる (= local file vs external DB) ため重複なし。"

  - component_id: ntfy_listener
    file_path: scripts/ntfy_listener.sh
    trigger_type: continuous
    cadence: "streaming reconnect"
    overlap_with_w11_trigger: none
    rationale: "ntfy streaming は携帯 → SC inbox の入力 channel、Supabase development_progress の状態遷移とは無関係。"

  - component_id: auto_git_sync_timer
    file_path: scripts/auto_git_sync.sh + ~/.config/systemd/user/auto-git-sync.timer
    trigger_type: scheduled
    cadence: "5 min FF pull"
    overlap_with_w11_trigger: none
    rationale: |
      両者 scheduled だが scope/cadence 全く異なる:
      - auto-git-sync: git remote → working tree FF pull、5min interval、pull-only。
      - watch_w11_trigger: Supabase development_progress 状態 query、10-15min interval、inbox notify-only。
      target API / cadence / write target が全件異、Anti-Dup pass。

  - component_id: watcher_supervisor
    file_path: scripts/watcher_supervisor.sh
    trigger_type: continuous
    cadence: "5s loop"
    overlap_with_w11_trigger: none
    rationale: "5s loop は既存 watcher process supervision 専用、scope 限定 (= 既存 docs/background_worker_eval_gate.md §Anti-Patterns で acceptable 認定)。W11 trigger とは別 layer。"

