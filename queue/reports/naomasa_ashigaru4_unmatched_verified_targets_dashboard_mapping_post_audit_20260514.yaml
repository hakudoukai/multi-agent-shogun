      Task YAML AC4 declares a closed task-manifest allowlist of five writable deliverable
      paths. Commit c1bd793 also modifies .gitignore. Because .gitignore is a shared
      repository control file and not present in the task-manifest authorized path list,
      the delivery violates its own AC4 scope boundary.
