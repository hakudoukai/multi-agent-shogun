      Karo must either issue an explicit scope exception / manifest revision that authorizes
      the .gitignore whitelist lines, or require a corrective report/scope revision before
      this can be passed.
  - id: high_guard_rejection_recorded_but_not_blocking
    severity: high
    perspective: 8_ops
    issue: |
      The final report records that check_file_path_owner.sh rejects .gitignore and the
      docs transition file under strict ashigaru4 mode, then treats the schema drift as a
      concern while marking AC4 pass. For a scope_contamination_v2-derived task, manual
      guard rejection cannot be downgraded without explicit Karo exception.
    recommendation: |
      Convert the report verdict to blocked/pass_with_exception after Karo authorization,
      and align task YAML with shared_files_allowlist or the current manifest allowlist
      schema.
  - id: medium_report_self_expands_authorized_paths
    severity: medium
    perspective: 9_doc
    issue: |
      The final report adds .gitignore to authorized_paths_written, but the assignment
      YAML did not authorize it. A completion report cannot expand its own write scope
      after implementation.
    recommendation: "Revise the report to distinguish task-authorized paths from extra paths requiring exception."

