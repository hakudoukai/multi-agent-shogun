      本 LAYER_CHILDREN 内に既登録。
    role_in_classification: |
      audited-blocked 12 件 status 整合 verify の対象 anchor 群。
      classification doc 内では 12 件 id + 既存 LAYER_CHILDREN 内 entry を
      引用形式で参照、改変は行わない。
    mc_dup_check_note: "本 task は本 constant を改変せず、12 件 id を doc 内に列挙 + test で existence assert。"

