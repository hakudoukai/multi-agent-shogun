existing_constants_and_functions_inventory:
  - component_id: PROGRESS_COLOR_TIERS_constant
    component_type: python_constant
    file_path: scripts/regenerate_dashboard.py
    line_range_approx: "182-187"
    axis: progress_percent_based
    description: |
      progress % → tier mapping (= 4 段階)。
      green ≥80 / yellow ≥50 / orange ≥25 / red ≥0。
      label = verified / in_flight / early / stalled、css_class = tier-{color}。
      docs/dashboard_design_v0.2.md §3.6 retain。
    role_in_classification: |
      progress %-based axis、本 task の task-state classification とは直交。
      pass_with_concerns visual (= 75% / yellow) はここで既に在 anchor (= 75 ≥ 50 → yellow)。
    mc_dup_check_note: "本 task は本 constant を改変せず、参照 anchor として doc 内引用のみ。"

  - component_id: STATUS_STAGE_PCT_constant
    component_type: python_constant
    file_path: scripts/regenerate_dashboard.py
    line_range_approx: "116-129"
    axis: status_stage_based
    description: |
      status string → base progress % mapping。
      blocked/not_started/failed=0、pending=10、drafted_pending_kuroda_pre_audit=15、
      assigned=25、in_progress=50、ready_for_audit=70、audit_pending=80、
      completed_pending_audit=85、done_pending_audit=90、audit_pending_verification=95。
    role_in_classification: |
      status string → progress % 紐付け、本 task の 3 分類 (implementation_required /
      monitor / manifest_pending) は本 mapping の **subset semantic grouping** として
      位置付ける (= 3 分類は status 列の意味分類、本 PCT は数値紐付け)。
    mc_dup_check_note: "本 task は本 constant を改変せず、3 分類が本 mapping と整合する事を doc + test で verify。"

  - component_id: progress_color_tier_function
    component_type: python_function
    file_path: scripts/regenerate_dashboard.py
    line_range_approx: "544-549"
    axis: progress_percent_based
    description: |
      def progress_color_tier(pct: float) -> dict[str, str]:
        PROGRESS_COLOR_TIERS を min_pct で線型探索、最初に該当する tier を返す。
    role_in_classification: |
      progress % → tier 解決 entry point。本 task の classification doc は
      本 function の semantic (= tier lookup) を doc 内に明示し、3 分類が
      progress-tier 軸とは独立して task-state 軸で適用される事を明文化する。
    mc_dup_check_note: "本 task は本 function を改変せず、参照 anchor として doc 内引用のみ。"

  - component_id: verdict_based_score_mapping
    component_type: python_logic
    file_path: scripts/regenerate_dashboard.py
    line_range_approx: "2042-2070"
    axis: verdict_based
    description: |
      verdict → score mapping:
      - shogun_verified=true → 100
      - verdict.startswith("pass") and not "pass_with" → (full pass, 100 path 候補)
      - verdict.startswith("pass_with") → 75 (= pass_with_concerns)
      - fail / 無 → 0 系
    role_in_classification: |
      pass_with_concerns visual (= 75 → yellow tier) は本 mapping で既装備。
      本 task は本 mapping を改変せず、classification doc 内に
      "pass_with_concerns → yellow conditional 表示 (= 既装備)" anchor として明示。
    mc_dup_check_note: "本 task は本 logic を改変せず、参照のみ。"

  - component_id: LAYER_CHILDREN_constant
    component_type: python_constant
    file_path: scripts/regenerate_dashboard.py
    line_range_approx: "194-510"
    axis: layer_structure
    description: |
      6 Layer (A-G) の子項目 mapping。Layer C に C-15-A / C-15-B1..B7 (W9 batches)、
      C-V21..V44 (Supabase phase) を含む。本 task の audited-blocked 12 件
