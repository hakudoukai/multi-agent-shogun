findings:
  pivotal_finding:
    - "**機能① 既実装 95%+**: POST /api/patient-checkin/qr / register_arrived_card / PatientCheckin.tsx 等が完成済 (= 元 task の新規実装は二重実装になる)。karo に msg_164436 で報告 → Option α (= spec 化 + gap 分析 + test 拡充) 採択 (msg_164541)。"
  gap_summary:
    high:
      - "G-S1: _generate_qr_token は patient_checkin.py:40-44 で SHA256('dentalbi-checkin-{clinic_id}-{date}')[:16]、secret 不含。任意者が clinic_id だけで token を再現可能、認証として脆弱。"
      - "G-L1: patient_checkin_logs / handover_notes の保存期間 + 暗号化規定が DB schema に無く、医療情報セキュリティガイドライン 6.0 (最低 5 年) 準拠不明。"
    mid:
      - "G-S2: token 有効期間 = 当日全日 (= 日付 + clinic_id のみ)、リプレイ攻撃に脆弱。short-window expire (e.g. 30 分 rolling、TOTP 様) で構造改善要。"
      - "G-S3: POST /api/patient-checkin/qr に rate limit 無し、DoS / brute force 余地。"
      - "G-L2: patient_no log mask は KGL1 fix で個別実装、logging filter で global 強制機構なし。"
      - "G-U1: BarcodeDetector 非対応 (Safari iOS < 17 等) 時の fallback 動線 frontend test 無し。"
      - "G-U3: 高齢者向け大文字 token 手動入力時の入力補助 (O/0 混同字対策、空白/小文字許容) 無し。"
      - "G-D1: SQLite (kanban) と Supabase (patient_checkin_logs / patient_app_notifications) の二重持ち、整合保証無し。"
    low:
