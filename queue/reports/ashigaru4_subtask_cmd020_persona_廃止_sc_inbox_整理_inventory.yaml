  - gap_3: "SessionStart hook warning #1 (= inbox 不在) は persona alias 例 'karo=hideyoshi、ashigaru4=maeda' を hint 提示するが、廃止候補リストや訂正 path 自体は karo + 陛下御差配経路に委譲、現状 alias 全件 retain で warning 発生は理論上のみ"
    resolution_plan: "docs/sc_inbox_整理_plan.md §5 で warning #1 解消 path (= alias 統合判定 → karo 起案 → 陛下御差配 → archive 実行 → SessionStart hook 例示更新) を 5 step 明示"
  - gap_4: "inbox_watcher.sh 第 1 引数 (agent_id) ↔ inbox file name 整合は SessionStart hook で機械 verify 済だが、第 2 引数 (pane_target) ↔ 物理 pane 整合は session 構造変化時に drift risk あり (= warning #3 path)"
    resolution_plan: "docs/sc_inbox_整理_plan.md §6 で pane_target 整合検証規範を specification 化、drift 発生時の karo 報告 path を明示 (= 自分で watcher 再起動禁、F002 違反 risk 防止)"

