council_moushi_engine_round1:
  - audit_id: naomasa_council_moushi_v01_round1
    target_type: design_doc_audit
    target_file: docs/moushi_engine_ui_design_v0.1.md
    target_commit_hash: "6063f58"
    audited_at: "2026-05-11T16:34:33+09:00"
    auditor: naomasa
    verdict: pass_with_concerns
    evidence_state: complete
    completion_gate: open
    log_path: queue/reports/naomasa_secondpc_report.yaml:council_moushi_engine_round1
    related_files:
      - docs/moushi_engine_ui_design_v0.1.md
      - docs/cmd004_moushi_engine_stage1_design.md
      - docs/dental_form_inventory/dental_form_inventory_v1.md
      - docs/dental_form_inventory/all_forms_field_map_v1.json
      - queue/reports/naomasa_secondpc_report.yaml
      - queue/reports/acha_secondpc_report.yaml
    external_references_checked:
      - "Apple Human Interface Guidelines Buttons: 44x44 pt hit region baseline"
      - "W3C WCAG 2.2 SC 2.5.8/2.5.5: 24px AA minimum / 44px AAA enhanced target size"
      - "PPC 医療・介護ガイダンス: 診療情報は要配慮個人情報、安全管理措置が必要"
      - "MHLW 診療録等電子保存解説: 歯科医師法23条 診療録5年保存"
      - "OpenAI Image generation docs: current API model family is GPT Image, latest noted as gpt-image-1.5, not a guaranteed `OpenAI Image 2.0` API endpoint"
    perspective_verdicts:
      1_func: concerns
      2_anti_dup: concerns
      3_kiritsu: pass
      4_logic: concerns
      5_schema: fail
      6_test: concerns
      7_legal: concerns
      8_ops: concerns
      9_doc: pass
      10_ecosystem_coherence: concerns
    round1_answers:
      q1_tonkatsu_hamakatsu_3_layer:
        verdict: pass_with_concerns
        answer: "3階層は初期入力として妥当。ただし Level2 の部位粒度が上下左右/奥前歯に留まり、歯科実装で必要な tooth_fdi・複数部位・経過/重症度との接続が不足する。v0.2では Level3 を症状詳細だけでなく severity/course/duration に分解し、複数主訴は entries[] として保存する設計に改めるべし。"
        evidence:
          - "docs/moushi_engine_ui_design_v0.1.md:13 §1.1 — 3階層タップ選択を提案。"
          - "docs/moushi_engine_ui_design_v0.1.md:18-25 §1.1 — Level2 が上/下/左/右/奥歯/前歯中心で、歯式や複数部位の保持方法がない。"
          - "docs/moushi_engine_ui_design_v0.1.md:28 §1.1 — tap数80% cover は推測かつ review 要と自記しており、機械 evidence では未確定。"
          - "docs/cmd004_moushi_engine_stage1_design.md:367-379 §3-2 — 既存Stage1設計は S2_Region multi_select と S3_Severity を持ち、v0.1より実装粒度が深い。"
      q2_touch_target_80dp_wcag:
        verdict: pass_with_concerns
        answer: "80x80dp 推奨は高齢者タブレットUIとして安全側で妥当。ただし `WCAG AA整合` は色彩だけで宣言できず、contrast ratio、focus visible、非色依存ラベル、target spacingを明文化する必要がある。60x60dpをApple/Material推奨と一括記述するのは不正確で、Apple 44pt、Material系 48dp、WCAG 2.2 AA minimum 24px/AAA enhanced 44px を区別して記すべし。"
        evidence:
          - "docs/moushi_engine_ui_design_v0.1.md:35 §1.2 — 60x60dp最小、80x80dp推奨と記載。"
          - "docs/moushi_engine_ui_design_v0.1.md:36 §1.2 — 色彩WCAG AA整合とあるが contrast 数値、foreground/background pair、icon外テキスト代替が未記載。"
          - "docs/moushi_engine_ui_design_v0.1.md:37 §1.2 — font 18pt+ 方針は高齢者対応として妥当。"
      q3_state_machine_linear_multi_complaint:
        verdict: pass_with_concerns
        answer: "直線+back可能の基軸は良いが、複数主訴追加、draft保存、timeout、cancel、同意NG、保存失敗、二重送信防止が state として不足。line57 の `END / 次の主訴追加 loop` は概念で、実装時は `S_AddAnother`、idempotency key、partial draft retention を別 state として必要。"
        evidence:
          - "docs/moushi_engine_ui_design_v0.1.md:44-58 §1.3 — STARTからSaveまでの直線 state は示すが、error/draft/timeout/consent branch がない。"
          - "docs/moushi_engine_ui_design_v0.1.md:57 §1.3 — 次の主訴追加 loop が終端コメントのみで、保存payloadや戻り先が未定義。"
          - "docs/cmd004_moushi_engine_stage1_design.md:338-415 §3-2 — S_Draft、S_BlockedConsent、multi_select、confirm edit など実装向け state が既に提案済み。"
      q4_nigo_sheet_schema_dd044:
        verdict: fail
        answer: "v0.1 の DD-044 schema 認識は要修正。`form_templates.nigo_sheet` をSoTと置く方向はよいが、v0.1が挙げる complaint_category/body_part/symptom_detail 等が既存 nigo_sheet field として実証されていない。Stage1既存設計は `/api/handover-sheets` と `handover_notes_anon` JSONB 経由で nigo renderer へ流す方針で、追加fieldsも input_mode/touchpanel_state_log/is_minor/consent_token_ref。v0.2は既存Stage1 §4-4を主SoTに寄せ、v0.1追加4 fieldsは analytics table または touchpanel_state_log 内に隔離すべし。"
        evidence:
          - "docs/moushi_engine_ui_design_v0.1.md:66-73 §2.1 — complaint_category/body_part/symptom_detail/free_text/entered_at/entered_by を構造化fieldsと記載。"
          - "docs/moushi_engine_ui_design_v0.1.md:75-84 §2.2 — entry_method/tap_count/entry_duration_sec/confidence_level 追加を提案。"
          - "docs/cmd004_moushi_engine_stage1_design.md:84-97 §1-2 — `/api/handover-sheets` を touchpanel 入力先に決定し、legacy `/api/handover` と分離。"
          - "docs/cmd004_moushi_engine_stage1_design.md:457-475 §4-1 — Stage1追加カラムは input_mode/touchpanel_state_log/is_minor/consent_token_ref。v0.1追加4 fieldsとは不一致。"
          - "docs/cmd004_moushi_engine_stage1_design.md:570-584 §4-4 — touchpanel出力は handover_notes_anon JSONB から nigoTemplateEngine/generate_nigo/nigo_sheet_renderer へ流すと定義。"
          - "docs/dental_form_inventory/dental_form_inventory_v1.md:42 — nigo_sheet は 2号用紙として存在するが、v0.1の構造化fields実在までは示さない。"
      q5_legal_privacy:
        verdict: pass_with_concerns
        answer: "同意/代理/撤回/保存/暗号化の5項目は論点として妥当。ただし医療情報は要配慮個人情報であり、入力前同意画面だけでなく利用目的通知、本人/保護者同意の記録、アクセス制御、監査ログ、local draftの扱いが必要。`24h以内なら撤回可` は診療録・院内引継ぎ記録の保存義務と衝突し得るため、物理削除ではなく status=void/利用停止/訂正追記として表現すべし。`改正医療法` という汎称は避け、歯科医師法23条/医療法・安全管理ガイドライン/個情法ガイダンスへ分解する必要あり。"
        evidence:
          - "docs/moushi_engine_ui_design_v0.1.md:90 §3 — 入力前の医療情報入力同意を必須と記載するが、既来院同意・小児保護者同意・staff代理入力の分離が未記載。"
          - "docs/moushi_engine_ui_design_v0.1.md:91 §3 — family_proxy mode はあるが、保護者/家族IDの権限検証・有効期限・revoked_at条件がない。"
          - "docs/moushi_engine_ui_design_v0.1.md:92 §3 — 24h撤回をUI配置とするが、保存済み医療記録の訂正/無効化/履歴保持との整合が不足。"
          - "docs/moushi_engine_ui_design_v0.1.md:93-94 §3 — 5年/10年保存、TLS/AES/key rotationは方向性として妥当だが、local draftやkey custodyが未定義。"
          - "docs/cmd004_moushi_engine_stage1_design.md:596-645 §5 — 個情法、医療法、児童福祉法、民法、LM1-LM5の未確定法務論点を分離済み。v0.1はここへ寄せるべし。"
      q6_openai_image_20_fallback:
        verdict: pass_with_concerns
        answer: "OpenAI画像生成を使えない場合の代替として SVG/ASCII/Markdown/HTML+Tailwind は妥当。ただし `OpenAI Image 2.0` をAPI前提名として固定するのは危険で、2026-05-11時点のOpenAI docsでは GPT Image family (`gpt-image-1.5`, `gpt-image-1`, `gpt-image-1-mini`) が現行API表記。v0.2では `画像生成は任意のvisual exploration、実装SoTはHTML/CSS prototype + component spec` と位置づけ、画像が使えない場合も開発停止しない工程にせよ。"
        evidence:
          - "docs/moushi_engine_ui_design_v0.1.md:98-114 §4 — SVG/ASCII/Markdown/HTML+Tailwind は確実、OpenAI Image 2.0 は陛下GUIまたは別path推奨と記載。"
          - "docs/moushi_engine_ui_design_v0.1.md:107-113 §4.2 — Figma/v0 access不明を正しく隔離。"
          - "docs/moushi_engine_ui_design_v0.1.md:116-140 §5 — 合議flowは画像生成依存でなく、v0.2 integrationへ進める構造。"
    findings:
      - severity: high
        perspective: 5_schema
        location: "docs/moushi_engine_ui_design_v0.1.md:66-84 §2.1-2.2"
        issue: "DD-044/nigo_sheetの既存構造化fieldsとして complaint_category/body_part/symptom_detail 等を置くが、既存Stage1 SoTは handover_notes_anon JSONB + `/api/handover-sheets` + nigo renderer 接続であり、v0.1の追加4 fieldsとも不整合。"
        recommendation: "v0.2では docs/cmd004_moushi_engine_stage1_design.md:570-584 の render path を正とし、entry_method/tap_count/entry_duration_sec/confidence_level は touchpanel_state_log または analytics side table に移す。"
      - severity: medium
        perspective: 4_logic
        location: "docs/moushi_engine_ui_design_v0.1.md:44-60 §1.3"
        issue: "state machine が正常系のみで、複数主訴、draft、timeout、consent_invalid、保存失敗、二重送信防止がない。"
        recommendation: "Stage1設計の S_Draft/S_BlockedConsent/S_Confirm を取り込み、`entries[]` と idempotency key を明示する。"
      - severity: medium
        perspective: 7_legal
        location: "docs/moushi_engine_ui_design_v0.1.md:86-95 §3"
        issue: "同意・撤回・保存・暗号化の論点はあるが、24h撤回が診療録保存/監査ログ保持と衝突し得る。個情法・医療法の条文粒度も粗い。"
        recommendation: "撤回は物理削除でなく status=void + 訂正追記 + 利用停止にし、保護者同意は consent_version/revoked_at/expires_at を必須化する。"
      - severity: medium
        perspective: 8_ops
        location: "docs/moushi_engine_ui_design_v0.1.md:30-40 §1.2"
        issue: "80x80dpは安全側だが、tablet landscapeで5-7 options + breadcrumb + progress + controlsを置く実寸grid/scroll規則がない。"
        recommendation: "10-13 inch landscapeで 2列/3列 grid、minimum spacing、focus ring、pressed/disabled/error state を明記する。"
      - severity: low
        perspective: 10_ecosystem_coherence
        location: "docs/moushi_engine_ui_design_v0.1.md:96-114 §4"
        issue: "`OpenAI Image 2.0` は現行API model名として固定しない方がよい。"
        recommendation: "visual mockup候補は `OpenAI GPT Image model via GUI/API if available` と抽象化し、SoTはHTML/CSS prototypeへ置く。"
    recommendations_for_v02:
      - "DD-044 §2は Stage1設計の `/api/handover-sheets` + handover_notes_anon + nigoTemplateEngine 経路を正として再記述する。"
      - "UI state machineは正常系3階層から、S_Draft/S_BlockedConsent/S_SaveFailed/S_AddAnother/S_Saved まで展開する。"
      - "法令§3は `撤回=削除` ではなく `訂正/無効化/利用停止 + 監査証跡保持` に語彙修正する。"
      - "アクセシビリティ§1.2に contrast ratio、focus visible、非色依存ラベル、target spacing、screen reader label を追加する。"
      - "OpenAI画像生成は任意の探索手段とし、アクセス不能時は HTML+Tailwind prototype を合議SoTにする。"
    test_evidence:
