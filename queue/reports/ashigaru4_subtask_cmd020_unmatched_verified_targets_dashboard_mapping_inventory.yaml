honest_finding_truth_gate:
  apparent_8_to_0_pivot_explanation_in_task_yaml: |
    task yaml は「8→0 transition = 既装着 retain_registry + matching logic が全件吸収」と仮定するが、
    truth gate 機械測定の結果はこの仮説と整合しない。実測 active_entries_total=0 (= shogun_verified=True
    かつ migration_note != legacy_migrated を満たす entry が SHOGUN_VERIFICATION_FILE
    (= queue/reports/shogun_verification_mainpc_log.yaml) に 1 件も存在しない)
    ため、unmatched=0 は「active entry 自体が 0」の trivial 帰結である。
    retain_registry の 4 entry (= UNMATCHED_VERIFY_RETAIN_REGISTRY) は metadata
    annotation 用 (= retain_status=registered/unregistered 付与) であって、
    unmatched 母集団そのものを 0 に圧縮する logic ではない。

  underlying_data_state:
    SHOGUN_VERIFICATION_FILE: queue/reports/shogun_verification_mainpc_log.yaml
    last_commit_touching: "80cc68e (2026-05-11T14:08:36+09:00 auto(main_pc) 6files)"
    file_state_at_snapshot_commit_41c659b: "verifications=105 / shogun_verified=True=12 / active(sv=True AND !legacy)=0"
    file_state_current_9ebb3e2: "verifications=105 / shogun_verified=True=12 / active(sv=True AND !legacy)=0"
    interpretation: |
      mainpc_log 自体は snapshot 時点 (2026-05-12 20:28) と現時点 (2026-05-14 00:21) で内容不変。
      よって snapshot helper_evidence の active_entries_total=41 と unmatched=8 は、
      snapshot 生成時 extract_unverified_inventory.py が読み取った state と git 履歴上の
      mainpc_log 内容との間に矛盾を残す (= 別 source 経由か or 同 commit に他 yaml の
      未追跡変更が並存していた可能性)。但し本 task scope では掘り下げ不要 — 機械測定の
      現実態 (= active=0、unmatched=0) を SoT とし、retain_registry 不変、dashboard
      mutation 禁、regression invariant 装着で根本治療する。

  three_way_diff_conclusion:
