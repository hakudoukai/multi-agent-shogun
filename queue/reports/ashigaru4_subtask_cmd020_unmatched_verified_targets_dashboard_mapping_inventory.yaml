    snapshot_8: "2026-05-12 snapshot 由来、当時 helper_evidence で active=41 / matched=17 / unmatched=8 と記録。"
    current_0: "2026-05-14 truth-gate 機械測定値。current SoT。dashboard.md mutation 禁、AC1 transition trace + AC2 regression invariant で固定化。"

  pivot_path_justification: |
    revision 2 task yaml の「regression test + documentation path」(= dashboard mutation 禁) は
    現実態整合。AC1 で 8→0 transition の trace (= retain_registry 追加 chain + active_entries
    減少 chain) を documentation 化、AC2 で current state 固定化 invariant を pytest 装着、
    AC3 で dashboard.md 不変 verify。既装着 helper (compute_shogun_reflection_stats /
    annotate_unmatched_with_retain / UNMATCHED_VERIFY_RETAIN_REGISTRY) は touch 禁。

