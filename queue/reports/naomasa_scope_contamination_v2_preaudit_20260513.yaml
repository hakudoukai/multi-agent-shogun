      - "The same task's historical pattern expects ashigaru deliverables to whitelist files in .gitignore."
    recommendation: "Use a task manifest allowlist in addition to owner mapping. Shared files should require explicit task_id/path authorization, not only Karo/Shogun ownership."

  - severity: medium
    perspective: "8_ops"
    issue: "AC4 auto-git-sync side-effect tests refer to rebase/detach/cherry-pick behavior, while scripts/auto_git_sync.sh is currently pull-only with ff-pull, local-ahead, divergent halt, stash dirty pull, and flock semantics."
