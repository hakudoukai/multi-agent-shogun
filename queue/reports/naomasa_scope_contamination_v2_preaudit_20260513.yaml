      - "tests/test_auto_git_sync.py already covers FF pull, divergent halt, up_to_date, local_ahead, flock, dirty stash."
    recommendation: "Change AC4 tests to align with the current pull-only script or explicitly mark rebase/cherry-pick checks as bounded-push workflow tests, not auto-git-sync unit tests."

