      - "AC2(h) says direct local tmux pane test is impossible, so design evidence + script presence verify."
    recommendation: "Split the requirement: ashigaru2 designs and tests the survey script; Karo performs or separately authorizes live all-pane verification. Do not make all-pane live inspection an ashigaru2 completion blocker."

  - severity: high
    perspective: "6_test"
    issue: "AC5 report finalization grep is overbroad. Searching pending/予定/planned/TBD/in_progress across report YAML will flag legitimate history, status labels, source quotes, and this very task's pre-implementation fields."
    evidence:
