      - "Task AC1(c) says current agent = git config user.name / fallback user.email."
    recommendation: "Make TMUX_PANE -> tmux @agent_id the primary identity source inside the hook when available. Treat git config as fallback evidence only, with an explicit warning when it is not an ashigaru id."

  - severity: high
    perspective: "8_ops"
    issue: "AC0 asks for all ashigaru pane git config and hook state, but the task also states local tmux direct test is impossible. This is internally inconsistent and can push ashigaru2 into broad pane inspection instead of scoped implementation."
    evidence:
