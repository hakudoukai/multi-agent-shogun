design_decisions:
  - "本能寺戒め: secret はコード hardcode 禁、env 経由のみ。test fixture は明示プレースホルダ secret を monkeypatch.setenv で注入 (= 本番 secret に直結しない設計)。"
  - "module 分離: backend/utils/qr_token.py に logic 集約、patient_checkin.py は thin wrapper。新規 caller (= 別 endpoint) も同 module 経由で統一可能。"
  - "三段階 rollout (= Stage A→B→C): 構造変更 + 仕組み追加 + migration path で根本品質、Stage B (= graceful fallback) を default 推奨にして実稼働後の段階移行を可能化。"
  - "TOTP window=900s (= 15 min) 既定: 受付窓口 staff 操作・clock skew・QR 読取 retry 余裕の三点バランス。env で上書可。"
  - "clinic_id を HMAC 入力に含む: cross-clinic replay 自動防御、別途 logic 不要。"
  - "status code map (= 400/401/403): RFC 7235 + RFC 9110 整合、frontend UI で error UX 分岐可能化。"

