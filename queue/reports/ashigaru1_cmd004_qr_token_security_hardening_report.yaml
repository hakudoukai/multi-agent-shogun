threat_model:
  defended:
    - "任意者の token 偽造 (= secret 不在で v1 公開計算式)"
    - "古い token replay (= TOTP window で 15 min 経過後 expired)"
    - "cross-clinic token 流用 (= clinic_id を HMAC 入力)"
    - "token 改竄 (= 1bit 変化で HMAC 不一致、constant-time compare)"
    - "HMAC brute force 推測 (= 128bit truncated MAC、空間 2^128)"
    - "secret 漏洩 (= rotation 手順 §3 で即時無効化)"
  not_defended_explicitly_deferred:
    - "同一 window 内 shoulder-surfing replay → β14 nonce tracker (= redis 等)"
    - "API DoS / brute force → β15 rate limit middleware (= cmd_004 spec G-S3)"
    - "patient_no enumeration → β16 patient_no 単独受付ロック (= 別 task)"
    - "OS-level secret 漏洩 → Secrets Manager (= AWS SSM 等、infra task)"

