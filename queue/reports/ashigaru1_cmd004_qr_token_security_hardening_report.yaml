acceptance_criteria_status:
  - id: AC1
    title: "HMAC-SHA256 + TOTP-style time-bound token、unsigned/expired は 401/403"
    status: PASS
    evidence: |
      実装:
        backend/utils/qr_token.py L18-L317:
          - v2 format: "v2.{clinic_id}.{counter}.{mac_b64url}"
          - mac = base64url(HMAC-SHA256(secret, "v2|{cid}|{counter}"))[:22] (= ~128bit)
          - counter = floor(unix_time / QR_TOTP_WINDOW_SEC)、default 900s (= 15 min)
          - skew = ±QR_TOTP_SKEW (= default ±1 window) で clock skew 吸収
          - hmac.compare_digest で timing attack 耐性
          - status_code_for: malformed/legacy_mismatch=400、signed_required=401、tampered/expired=403
        backend/routers/patient_checkin.py qr_checkin: reason→HTTP map + detail map
      test 機械 evidence:
        TestQrTokenSecurityHardening::test_signed_token_issued_when_secret_set    PASSED
        TestQrTokenSecurityHardening::test_signed_token_accepted_for_valid_request PASSED
        TestQrTokenSecurityHardening::test_signed_token_rejects_malformed_v2      PASSED
        TestQrTokenSecurityHardening::test_signed_token_window_skew_tolerance     PASSED
        TestQrTokenSecurityHardening::test_token_endpoint_returns_meta_for_legacy_mode PASSED

  - id: AC2
