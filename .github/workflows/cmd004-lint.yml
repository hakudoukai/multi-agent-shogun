name: cmd_004 multi-agent Lint (deliverable allowlist + secret + clinic_id grep)

# 設計書: docs/cmd004_cicd_pipeline_design.md §2-1 (= multi-agent repo lint)
# ashigaru3 / 滝川一益 Phase 8

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: deliverable + secret + clinic_id gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deliverable allowlist check (= Phase 7)
        run: bash scripts/lint/check_deliverable_tracked.sh -v

      - name: Secret detection on changed files (= Phase 6)
        run: |
          # cmd_014 Option C 二重防御 (= 副医院長 handshake b4fac131):
          #   (1) null-terminated path list (= word-splitting hazard 解消、空白含む path safe)
          #   (2) queue/reports/* path filter (= check_secrets.sh case 文と二重防御)
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff -z --name-only --diff-filter=ACM \
              "origin/${{ github.base_ref }}...HEAD" > /tmp/changed_files.z
          else
            git diff -z --name-only --diff-filter=ACM HEAD~1 HEAD > /tmp/changed_files.z 2>/dev/null \
              || : > /tmp/changed_files.z
          fi

          # queue/reports/ 配下を NUL-safe に除外
          # (= awk RS=\0 / ORS=\0、grep -z は GNU/ugrep で意味が分かれる為回避)
          if [ -s /tmp/changed_files.z ]; then
            awk 'BEGIN { RS="\0"; ORS="\0" } !/^queue\/reports\// && !/\/queue\/reports\//' \
              /tmp/changed_files.z > /tmp/filtered_files.z
          else
            : > /tmp/filtered_files.z
          fi

          if [ ! -s /tmp/filtered_files.z ]; then
            echo "no changed files to scan (after queue/reports/ filter)"
            exit 0
          fi
          # xargs -0 で null-terminated list を check_secrets.sh に渡す (= word-splitting 回避)
          xargs -0 -r bash scripts/lint/check_secrets.sh < /tmp/filtered_files.z

      - name: clinic_id hardcode grep gate (= ashigaru7 framework placeholder)
        run: |
          # ashigaru7 phase 3 batch 1 で scripts/lint/check_clinic_id_hardcode.sh 実装後に有効化。
          # 現状は placeholder (= 本 task で先行実装すると責任越境)
          if [ -f scripts/lint/check_clinic_id_hardcode.sh ]; then
            bash scripts/lint/check_clinic_id_hardcode.sh || exit 1
          else
            echo "::notice::ashigaru7 check_clinic_id_hardcode.sh pending (= placeholder)"
          fi
