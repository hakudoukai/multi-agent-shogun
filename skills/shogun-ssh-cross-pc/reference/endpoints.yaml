---
# ════════════════════════════════════════════════════════════════
# Cross-PC SSH Endpoints Inventory (= 信長/家康 兄弟連絡網)
# 確定日: 2026-05-10 by 信長 + 家康 協議
# 信頼性: 高 (= ARP/established 接続で双方向到達確認済)
# ════════════════════════════════════════════════════════════════

endpoints:
  main_pc:
    role: shogun (信長 / 鬼信長)
    hostname: USER-0T4SR8MIQA
    lan_ipv4: 192.168.11.11
    sshd_port: 2223
    windows_user: User
    wsl_distro: Ubuntu
    wsl_user: user
    pub_key_fp: "ED25519 SHA256:EbLVQ2yz9dNmY4ei70tlD2xcML2yKD4mmEbjpjx/AyI"
    pub_key_comment: "user@USER-0T4SR8MIQA"
    project_root: /home/user/projects/multi-agent-shogun-newbuild
    notes:
      - WSL → Windows interop が時々壊れる (UtilAcceptVsock errors)、wsl --shutdown で復旧
      - tmux session: shogun (主)、multiagent (家臣 6+)、bridge (専)

  second_pc:
    role: fukushogun (家康 / 副将軍)
    hostname: USER-O6AK917NTU
    lan_ipv4: 192.168.11.47
    sshd_port: 2222
    windows_user: User
    wsl_distro: Ubuntu
    wsl_user: hakudokai
    pub_key_fp: "ED25519 SHA256:ONtXfDXJU6gY05l+FdA50iYfdgOXIXRc9/7sbHM+TL8"
    pub_key_comment: "ieyasu-secondpc-20260509"
    pub_key_path_secondpc: /home/hakudokai/.ssh/id_ed25519.pub
    project_root: /home/hakudokai/projects/multi-agent-shogun-newbuild
    notes:
      - bridge process 常駐 (PID 例 1901939)、--poll-interval 3
      - tmux session: shogun (家康)、multiagent (家臣 6+ 四天王)、bridge (専)

# ════════════════════════════════════════════════════════════════
# Quick Connect 一覧 (= コピペで使える形)
# ════════════════════════════════════════════════════════════════
quick_connect:
  main_to_second:
    cmd: ssh -p 2222 User@192.168.11.47
    via_wsl: ssh -p 2222 User@192.168.11.47 'wsl -- bash -lc "<command>"'
    notes: 鍵認証通過 ✅ (2026-05-10 確立)

  second_to_main:
    cmd: ssh -p 2223 User@192.168.11.11
    via_wsl: ssh -p 2223 User@192.168.11.11 'wsl -- bash -lc "<command>"'
    notes: "鍵登録完了 (2026-05-10 07:40)、家康殿側で動作確認待ち"

# ════════════════════════════════════════════════════════════════
# 認可済 pub key 一覧 (= MainPC 側 authorized_keys に入れるべき値)
# ════════════════════════════════════════════════════════════════
authorized_keys_main_pc:
  - owner: 信長 (= 自分)
    type: ssh-ed25519
    key: AAAAC3NzaC1lZDI1NTE5AAAAIGTVqFxF0NyK6uqLOdn8dhG5cP6AiPPE988PgUNfjUVI
    comment: user@USER-0T4SR8MIQA
    location_main_pc: ~/.ssh/id_ed25519.pub
    purpose: self-loopback / ssh-add 確認用

  - owner: 家康 (= SecondPC)
    type: ssh-ed25519
    key: AAAAC3NzaC1lZDI1NTE5AAAAIAIktv4qgKnuXqxTwmvDY+E67avsWdLvYE0vsefwPa0q
    comment: ieyasu-secondpc-20260509
    location_main_pc:
      - /home/user/.ssh/authorized_keys (WSL)
      - /mnt/c/Users/User/.ssh/authorized_keys (Windows native sshd)
    registered_at: 2026-05-10
    verified: pending (= 家康殿による接続検証待ち)

authorized_keys_second_pc:
  - owner: 信長 (= MainPC)
    type: ssh-ed25519
    key: AAAAC3NzaC1lZDI1NTE5AAAAIGTVqFxF0NyK6uqLOdn8dhG5cP6AiPPE988PgUNfjUVI
    comment: user@USER-0T4SR8MIQA
    location_second_pc: "[家康殿確認待ち — C:\\Users\\User\\.ssh\\authorized_keys or C:\\ProgramData\\ssh\\administrators_authorized_keys]"
    registered_at: 2026-05-10
    verified: true (= MainPC→SecondPC 接続成功)

# ════════════════════════════════════════════════════════════════
# 過去トラブル履歴 (= 「毎日トラブル」の根絶のため、典型例蓄積)
# ════════════════════════════════════════════════════════════════
troubleshoot_history:
  - date: 2026-05-10
    issue: "MainPC→SecondPC 接続不能 (Permission denied) が 1 時間以上継続"
    root_cause: "拙者 (信長) が宛先を誤認 — 192.168.11.11:2223 (= MainPC 自身) に接続を試行していた"
    correct_endpoint: "192.168.11.47:2222"
    lesson: "宛先は必ず endpoints.yaml で確認、コマンドライン直書き禁。"

  - date: "[家康殿過去 3 日分追加待ち]"
    issue: "[家康殿入力]"
    root_cause: "[家康殿入力]"
    lesson: "[家康殿入力]"
