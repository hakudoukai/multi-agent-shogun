teki: |
  ★的は「此の枝を着地させるか、捨てるか」一件のみ★。
  origin に mac の枝は 60 本在る。其の内 ★origin/main(4be3ee19e1c5)に取り込まれて居るのは 1 本のみ★。
  15 本は「不要(tip が他枝の祖先)」と既に名指した(臺帳 17d7dbf7)ゆゑ ★触れるな★。
  残 45 本を三席で分けた。貴殿の組 = ★ashigaru-mac-1/2/3 の枝 18 本 (18 本)★。
  ★消す事ではない。着地の道を測る事である。★枝は一本も消すな。

toi: |
  ㋐ 母數を宣せ。割当の枝を逐語で列べ、full sha を書け。
     ★手許に物が在るか★を `git cat-file -e <sha>^{commit}` で一本づつ検め、rc を書け。
  ㋑ ★二つの差分を測り分けよ(混ぜたら其れ自体が疵)★:
     ⑴ 対 origin/main の差分 file 数 = `git diff --name-only 4be3ee19e1c5...<sha>` の行数
     ⑵ ★自前★の差分 file 数 = 60 本の mac 枝 tip の内、其の枝の★真の祖先★である tip を悉く挙げ、
        `git rev-list --count B..X` が最小の B を選び、`git diff --name-only B..X` の行数
     ★⑴は「此の枝が変へた file 数」では★ない★。★origin/main が何 file 遅れて居るか★である。
     ★數が何を意味せぬかを紙に書け(数の規律3)。★祖先 tip が一本も無い枝は ⑵=測れぬ と書き、其の旨を宣せ。
  ㋒ commit 数(`git rev-list --count 4be3ee19e1c5..<sha>`)と、触る top-level 領域を列べよ。
  ㋓ 仕分けよ。甲=★着地させる(PR)★ / 乙=★捨てる(理事長裁を待つ)★ / 丙=★測れぬ★。
     ★判ずる拠り所を先に宣してから使へ。★(例: 器を据ゑる変更を含むか／紙のみか／他枝が悉く含むか)
     各々に理由を一行。丙が在るなら「何を測れば判ずるか」を書け。
  ㋔ 甲(着地候補)には ★受入条件★ を書け ―― 何を満たせば PR として通せるか。
     (門 rc=0 か／臺帳が束内相対か／対照が在るか／他枝と同じ file を触つて衝突するか)
  ㋕ 重なりを測れ。割当群の中で tip が他の tip の★祖先★に成つて居る対を悉く名指し、鎖(chain)を描け。
     ★鎖の末端のみ着地させれば足りるか否か★を、理由付きで言へ。

