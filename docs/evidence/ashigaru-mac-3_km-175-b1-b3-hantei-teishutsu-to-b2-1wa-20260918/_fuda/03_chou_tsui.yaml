  hon: "★次の弾 km-123 ―― 門の誤停止 48.3% を、断の出る紙にせよ★\ntask_id: km-123-mon-no-goteishi-ritsu-wo-dan-no-deru-kami-ni-seyo-20260917\n束: docs/evidence/ashigaru-mac-3_km-123-mon-no-goteishi-ritsu-20260917/\n着手時刻を先に報せ、宣ETA を添へよ。km-119 の九通、殊に ㋑の白状(己の判別子が\n★両側に誤る★と自ら書いた事)は良い仕事であつた。家老は其れを其の儘 上へ載せる。\n\n★何故 之を問ふか★\n  貴殿が km-119 ㋒⑸ で測つた: 本日の束89本へ現に門を當て、★甲=43/89 止 48.3%・乙=37/89 止 41.6%★。\n  ★半分が止まる門は、据ゑれば正直な仕事を止める。★ 之は門を据ゑるか否かの断を左右する唯一の数である。\n  然るに今の紙は「率」しか無く、★止まつた43本の内 何本が真の疵で 何本が方言差か★が分かれぬ。\n  分からぬ儘では家老は委員長へ「据ゑて可」とも「不可」とも申せぬ。\n\n㋐ 止まつた43本(甲の渡し方)を ★一本づつ★ 表にせよ。欄 = 束名 / 落ちた條(①〜⑤) / 逐語の鳴り /\n   ★真の疵か方言差か★ / 其の判じの根拠。★「測れぬ」も一つの値として書いてよい★ ―― 憶測より遥かに良い。\n㋑ 其れを束ねて ★三つの数★ にせよ: 真の疵=N本 / 方言差=N本 / 測れぬ=N本。和が43である事を検算せよ。\n㋒ 方言差が多いなら、其の方言を ★名指して★ 数へよ(貴殿と專任2 が既に 14形以上を知つて居る)。\n   臺帳の根が束内相対か否か・lines欄の有無・引用符の有無 で切れ。\n㋓ 案は三つまで。⑴門を据ゑぬ(現状維持)を ★必ず一案として数で評せよ ―― 之が既定★。\n   ⑵渡し方を定める(控と MANIFEST を除く等・貴殿の乙形) ⑶門を方言に寛容にする、等。\n   各案につき ★止まる本数が43から幾つへ動くか★ を現に走らせて測れ。走らせずに見積るな。\n㋔ 断ひとつ。★据ゑるな・commit するな★ ―― 家老が委員長へ伺ふ為の紙である。\n㋕ 門 rc=0 を二走。控の名を紙に書け。cd 束 → append(第一引数=臺帳)、門は KM_GATE_MANIFEST_BASE=. 付。\n\n★禁★ commit・push・枝作り・refs への書込み 悉く禁。\n     settings.json / hook / scripts/ の書換へ 悉く禁(変更統制)。\n     稼働中の watcher・他席の worktree 不触・束に空白を含む名の実体を置くな。\n"
