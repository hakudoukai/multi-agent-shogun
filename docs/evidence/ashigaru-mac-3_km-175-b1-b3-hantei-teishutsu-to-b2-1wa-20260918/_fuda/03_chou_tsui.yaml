  hon: "★命(二本先) ―― 門 條② の「鳴りが反転する」穴を実射で確かめ、材を作れ。直すな。★\n\n㋐ 何故= 貴殿は km-153 で 條④ の穴(CRLF に鳴らず・0byte に鳴る)を紙で破つた。★同じ門の條② には\n  別の穴が在ると當席の memory に在る★ ―― 「②は鳴りが反転・NUL 前で濡れ衣・-v で②③入替」。\n  ★併し memory は書いた時の真であつて今の真ではない。★ ∴ ★今の器で実射して確かめよ。★\n  器= scripts/checks/karo_mac_dasumae_gate.sh(★稼働 disk の版を読め・他の checkout の兄弟を読むな★)。\n\n㋑ 測る物(材のみ・据ゑるな):\n  ⑴ ★條② が何を看るのか★を器の字面から逐語で引き、行番号ではなく★逐語で位置を名指せ★\n     (行番号を焼くな ―― 版が動けば嘘になる)。\n  ⑵ 陽性対照= 條② が★鳴るべき★紙を作り、鳴る事を示せ。出目は stderr にも出る\n     ∴ ★out と err を共に読め★(門自身の行と結語=stderr / verify.py の要約=stdout)。\n  ⑶ ★反転の実射★= 條② が「鳴るべきでない紙」に鳴り、「鳴るべき紙」に黙るか否かを\n     ★両方向★で撃て。片方向だけでは反転とは言へぬ。鳴り/黙りの各々に rc を添へよ。\n  ⑷ NUL の濡れ衣= NUL を含む紙を通し、條② が★他の紙を咎めるか★を見よ。\n     咎めた紙の名を全て挙げ、★母數と根と深さ★を書け(零には四つの札が要る)。\n  ⑸ -v での入替= 冗語を立てた時に ②と③ の出目が入れ替はるか否かを実射せよ。\n  ⑹ ★memory との突合★= 上の四つの出目が memory の記述と合ふか否かを一行ずつ ○/× で書け。\n     ★×が在つても直すな ―― 「memory が古びた」事自体が成果である。★\n\n㋒ 出す物= 束 docs/evidence/ashigaru-mac-3_km-178-mon-jou2-no-nari-no-hanten-wo-jissha-de-hakaru-20260918/\n  へ紙と臺帳を置け。★臺帳の根は束内相対★ ∴ cd <束> してから karo_mac_manifest_append.py を呼び、\n  門は KM_GATE_MANIFEST_BASE=. を要する。門は二度通せ。★證の紙を /tmp に置くな。★\n\n㋓ 境:\n  ・★門の器を直すな★(変更統制=委員長の事前許可が要る)。治し方の案は紙に書くだけにせよ。\n  ・押すな・commit は `git add -f` で file を名指し(.gitignore:7 の `*` は書換へぬ)。\n  ・★共有樹の HEAD/index は触るな★ ―― 現に貴殿の枝 4e4cfeeb が掛かつて居る。他席の樹も触るな。\n  ・板は書くな。之は家老発の弾ゆゑ板に行が無い(裁332455)。着地時に家老が四点を委員長へ寄越す。\n  ・km-175 が先。之は二本目である。"

