teki: "★的は「PR#20 が着地した直後の repo で、門の四版はどう並ぶか」を★着地前に★数で出す一件★。\n\n家老が既に測つた事(再測歓迎・食ひ違へば★家老の値を捨てよ★):\n  ⑴ origin/main = 4f591fc021947b9f477b676c96e36a1dc4437500\n     PR#20 の head = 4c99ff7c2a8466487d13a1494ed8f4fa9ca053f7\n     PR#20 の merge ref = 849b927a7c852598e6fd41c098f2db66bc5e0ec5 ★算出済=衝突は解けて居る★\n     手元 main = 363d5fb060845171338c067ef42bfcbef8ad9188 (origin/main に対し 16進み25遅れ)\n     守りの枝 karo-mac/local-main-363d5fb は origin へ着地済(可逆の担保)。\n  ⑵ PR#20 が main へ足す★器は僅か3本★:\n     scripts/checks/karo_mac_dasumae_gate.sh   追加 310行 (A)\n     scripts/checks/karo_mac_gate4.sh          追加  88行 (A)\n     scripts/inbox_write.sh                    変更 +50/-2 (M)\n     (残り 476本は docs/evidence 424 と queue/reports 52。器ではない。)\n  ⑶ 家老の枝 karo-mac/evidence-4taba-20260917 = 65cc1f1c8be9769aad70bc122697c129004b5db5\n     は origin/main の上に★163本の追加のみ★(A163/M0/D0)。器に一指も触れて居らぬ。\n\n★読取と己の仮束のみ。実際に merge も push も rebase もするな。fetch は己の名前空間\n refs/km113/* へのみ。他席の枝・worktree・refs/remotes/origin/* に触れるな★。\n"
toi: "㋐ ★着地後の版表を先に作れ★。門に関はる器(karo_mac_dasumae_gate.sh /\n   karo_mac_gate4.sh / karo_mac_manifest_verify.py / karo_mac_manifest_append.py、\n   他に在れば足せ)に付き、次の五欄で blob と行数を並べよ:\n     origin/main ／ PR#20 head(4c99ff7c) ／ ★PR#20 merge(849b927a)★ ／\n     手元 main(363d5fb) ／ 家老枝(65cc1f1c)\n   ★存否は `git cat-file -e` で測れ★ ―― `git rev-parse <rev>:<path>` は解けぬ時\n   其の綴りを stdout へ刷る(家老が之で誤つた)。\n㋑ ★着地で四版が三版に成るのか、五版に成るのか★を数で断ぜよ。\n   km-110 で貴殿が「正」と選んだ版は、上の五欄の何れと blob が一致するか。\n   ★一致せぬなら、其の版は着地後も repo の何處にも無い★ ―― 其の事を名指して書け。\n㋒ ★席が今 走らせて居る版は何處から来るか★。\n   repo の作業樹・各席の worktree・~/bin 等、★実際に呼ばれる path★ を歩き、\n   着地で其れが変はるか否かを示せ。変はらぬなら ★着地しても席の振舞ひは変はらぬ★\n   と書き、其の含意(則は直つても現場は直らぬ)を逐語で述べよ。\n㋓ ★Root Cause 4 Patterns の裁★。四版併存は ①旧版と新版の併存 か\n   ④同名同責務の重複定義 か、両方か。★git の振舞ひで答へよ(憶測禁)★。\n   共通の祖を歩いて「何處で割れたか」の commit を名指せ。\n㋔ ★收斂の案★。四版を一本へ寄せる道を二つ以上挙げ、各々に付き\n   ⑴ 誰が何を押すか ⑵ 走行中の席を壊さぬか ⑶ 可逆か(戻し方を一行で)\n   を書け。★据ゑるな・押すな ―― 紙に書くのみ。決めるのは委員長、押すのは総監督★。\n㋕ 門 rc=0 を二走。★臺帳の根は束内相対★ゆゑ `cd <束>` してから append を呼び、\n   門は `KM_GATE_MANIFEST_BASE=.` を付けよ。控は★走る毎に別名★・★臺帳へ入れるな★。\n"
