  hon: "★命 ―― 紙の名と argv の穴を塞ぐ当て紙を作れ(貴殿の km-161 納め④ を受けて)★\n\n貴殿が見つけた六つは、いづれも ★門の判定が入れ替はる★ か ★止まる★ 類である:\n  ⒜ 名 `-` = grep が stdin を読み、CRLF の紙が 條③ 黙りで ★偽の青★\n  ⒝ 名 `-e` = grep の option と読まれ ★濡れ衣(測れぬ)★\n  ⒞ 名 `-r` = grep -r が cwd を歩き、FIFO が在れば ★永久に止まる★(★最も重い★)\n  ⒟ 同じ紙を二度渡すと 條⑤ が二度足し、byte和 が実の倍 ―― 境目で ★通と落が入れ替はる★\n  ⒠ 清い紙への symlink が「測れぬ」(旧版は通した)\n  ⒡ 非UTF-8 の byte(0x80 行末)が rc0 で告げられぬ・先頭 BOM は條文の穴\n\n⑴ 六件を ★一件づつ★ 再現する紙を束の fixtures に作り、旧版/新版の出目を並べよ。\n   ⒞ は ★FIFO を置かずに★ 危険を示せ(歩く事実だけを測れ。★止めて見せるな★)。\n⑵ 直しの案を当て紙に落とせ。貴殿の案(`grep -c -- ` 等の `--` 締め)を軸に、\n   ★同じ紙の二度渡し★ は正規化(realpath で畳む)か重複の宣告か、どちらが正かを ★測つて★ 書け。\n⑶ symlink と BOM は ★條文の穴★ ゆゑ、器の直しではなく ★條文の改め案★ を一行で書き、當席が上へ上げる。\n⑷ 母數と刻を必ず書け。★率だけを書くな。★\n\n宣ETA を先に出し、實測と併せて報せよ。\n禁: 門(scripts/checks/karo_mac_dasumae_gate.sh)と負テスト本体を ★直に書き換へるな★(PR#27 が merge 保留の審査中である)。\n禁: commit するな・押すな・共用樹の HEAD/index を触るな・他席の樹に入るな。\n形: 直しは ★当て紙(patch)★ として束に置き、`git apply --check` の rc だけを取れ(`--check` 無しで当てるな)。\n形: 試すのは束内の ★写し★ の上でのみ。門の sha256 が前後で不動である事を刷れ。\n形: 期待値は ★先に★ 表へ書き、書いた刻を刷つてから走らせよ(後付けの期待は證に成らぬ)。\n形: 束は docs/evidence/<席名>_<task_id>/ ・臺帳を据ゑ `cd <束>` して KM_GATE_MANIFEST_BASE=. で門を二度通せ。\n報: 300字の條ゆゑ便を分けよ。★識別子を略すな ―― 略さず分けよ。★"
