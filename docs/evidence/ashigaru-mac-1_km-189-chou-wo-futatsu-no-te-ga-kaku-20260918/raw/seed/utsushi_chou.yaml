  evidence_bundle: docs/evidence/ashigaru-mac-1_km-181-mitsu-no-naoshi-kagyaku-bak-futekisuto-20260918/
  hon: "【km-181 ★三つの直し ―― 悉く可逆・bak・負テスト付き★】(家老mac発・板 ec1be454 の續・裁333131+333134)\n\n◆許しの出所を先に書く(推量で動くな):\n・㋐ mac-4 の4行の字下げ = ★裁333134「A 可」★(逐語「4行の字下げ=可逆・bak を取り parse 前後で検算」)。\n  ★案B(archive 退避+stub)は★不要★と裁が明言した ―― 停止席は★会話保存の儘 触らぬ★。退避も stub も作るな。\n・㋑ 帳へ書く器の「書込の前に parse」 = 裁333131⑵。\n・㋒ slim_yaml の {} と inbox_watcher.sh L463 の except: pass を fail-loud へ = 裁333131⑶(裁333134「次弾で可・可逆・bak・負テスト」)。\n★三つとも「可逆・bak・負テスト」が許しの條件である。條件を欠けば許しは無い物と思へ。★\n\n◆㋐ queue/tasks/ashigaru-mac-4.yaml の4行を根の鍵へ\n當席が己で測つた現状(貴殿の報と逐語一致): 857行・114132 bytes・CR 0・git 追跡外・\nsha256 a727520c45e7b8e7e284932612363887769621e915910a65b6c5b6b3f9c96ddc。\ncol1 の `- ` は L275 `- saitei_z45:` / L292 `- task:` / L379 `- task_id: km-a4-onaji-miharu-ga-nijuu-ni-hashiru-ne` / L418 `- id: saitei_z69` の★4本★。\n手順: ⑴bak を束の中へ(★/tmp に置くな★) ⑵直す前に sha256 と行数を記す ⑶★行番号を焼き込むな★=逐語で当てて直す\n⑷直した後 PyYAML で parse を当て、鍵数と全鍵名を前後で並べて出す(★鍵が1本でも消えたら戻せ★)\n⑸bak と新版の diff(unified)を束へ ⑹新 sha256 と行数 ⑺★負の対照★=直す前の bak が今も parse で落ちる事を示せ。\n★他席(1/2/3)の帳には一字も触るな。mac-4 の pane にも触るな(停止席・会話保存)。★\n\n◆㋑ 帳へ書く器に「書込の★前★の parse」を据ゑる\n先に★母數★を出せ: 席の帳(queue/tasks/*.yaml)へ★書く★器を歩いて数へ、名を列ねよ(読むだけの器は別に数へよ)。\n其の上で ⒜in-repo の器のみ直せ ⒝★~/bin の当席の器(board_write.py 等)には触るな★(credential を持つ・家老と総監督の手)\n⒞形は「案を作る→dump→再 parse→鍵数と既存鍵の逐語一致を assert→★通つた時のみ書く★」\n⒟★負テスト★=壊れる案を渡すと★書かずに落ちる★事を示し、其の時 file が一字も動かぬ事を sha256 で示せ\n⒠assert を書込の★後★に置く形は禁(★之が當席の今日の疵である★ ―― 當席は字下げ無しで4行を差し込み帳を一時 parse 不能にした)。\n\n◆㋒ 眠る fail-open 二道を fail-loud へ\n⒜ slim_yaml の parse 失敗 → 今は {} を返して★黙つて飛ばす★。鳴らせ(stderr と rc)。\n⒝ scripts/inbox_watcher.sh の L463 近傍 `except: pass` → 鳴らせ。★行番号を焼き込まず逐語で当てよ。★\n★但し★: ⑴★稼働中の watcher を止めるな・起こすな・restart するな(Mac事業部長の手)★\n⑵走つて居る process は★古い inode を読む★ゆゑ、直しても現走行は変はらぬ ―― 其の事を紙に書け(「直した=効いた」と書くな)\n⑶負テスト=壊れた yaml を食はせて★鳴る★事と、正しい yaml で★鳴らぬ★事の両方(陰性対照)。\n⑷bak を取り、rc と stderr の逐語を束へ焼け。\n\n◆彫りと枝(★裁333060⑶=1弾1枝★)\n彫る物は ⑵⑶ の器(in-repo)である。★origin/main 6bde7170ce574090a6139ba2dfe3aa4cb6db8634 から己の新枝を1本切れ★(km-180 の枝と混ぜるな)。\nqueue/ の物は git 追跡外ゆゑ commit せぬ ―― 束の紙(bak・diff・sha256)で示せ。commit は git add -f で名指し・★--only で彫り reset は打つな★。\n\n◆境: 押すな・gh を叩かぬ・main 不触・他席の生きた樹と枝に触るな・板は書くな(★板は家老の手★)・證の紙を /tmp に置くな。\n臺帳の根は束内相対(cd <束> してから append・門は KM_GATE_MANIFEST_BASE=. を要す)。門は二度・控は別名・out と err を共に読め。\n監査は sb-ashigaru-mac-1 で軍師mac へ直送(parent_seq 332455)・★判定は弾ごとの固定 commit を書け(裁333060⑵)★。\n★宣ETA を先に出し、後で丸めぬ差を書け。★"
