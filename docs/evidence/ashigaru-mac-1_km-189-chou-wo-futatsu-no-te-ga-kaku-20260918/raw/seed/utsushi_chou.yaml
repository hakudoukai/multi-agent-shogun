  hon: "★命 ―― 閾の四口の穴を塞ぐ当て紙を作れ(貴殿の km-161 納め③ を受けて)★\n\n貴殿が測つた中で ★最も重い一件★ は此れである:\n  ★`DASUMAE_READ_TIMEOUT=0` が rc0 で通り、GNU timeout の「時限無し」へ倒れる ―― 止の守りが黙つて消える。★\n「鳴らぬ」は「無害」ではない。時限が消えれば FIFO 一本で門が永久に止まる。\n\n⑴ 三口(MAX_BYTES / READ_TIMEOUT / 其の他貴殿が数へた口)ごとに、次の値で ★出目の表★ を作れ:\n   0 / 負(-1) / 前に空白 / 後に空白 / `+5` / 空 / 非數 / 2^63超。\n   欄は 値・rc・診断の行数・診断の逐語・注入の有無・生の制御字の有無 とせよ。★rc だけで褒めるな。★\n⑵ 貴殿の案(`num_same_op` の後に字面 case を置く形)を ★当て紙★ に落とせ。\n   ★倒した事を刷る★ 既存の作法(既定へ倒した旨を必ず一行出す)を壊すな。\n   `0` を「時限無し」と読ませぬ形にせよ ―― 0 を受けるか撥ねるかは貴殿が測つた上で案を書き、當席が裁す。\n⑶ 負テストへ足す件を ★負テストの当て紙★ として書け(本体を直に触るな)。\n⑷ ★己の期待の誤り 2 件★ も表に残せ(貴殿が既に名乗つた通り、先に書くのが正である)。\n\n宣ETA を先に出し、實測と併せて報せよ。★並走するなら「合計で引く」形で宣せよ(貴殿の km-161 納め⑥ の改め)。★\n禁: 門(scripts/checks/karo_mac_dasumae_gate.sh)と負テスト本体を ★直に書き換へるな★(PR#27 が merge 保留の審査中である)。\n禁: commit するな・押すな・共用樹の HEAD/index を触るな・他席の樹に入るな。\n形: 直しは ★当て紙(patch)★ として束に置き、`git apply --check` の rc だけを取れ(`--check` 無しで当てるな)。\n形: 試すのは束内の ★写し★ の上でのみ。門の sha256 が前後で不動である事を刷れ。\n形: 期待値は ★先に★ 表へ書き、書いた刻を刷つてから走らせよ(後付けの期待は證に成らぬ)。\n形: 束は docs/evidence/<席名>_<task_id>/ ・臺帳を据ゑ `cd <束>` して KM_GATE_MANIFEST_BASE=. で門を二度通せ。\n報: 300字の條ゆゑ便を分けよ。★識別子を略すな ―― 略さず分けよ。★"
