  hon: "★km-127 ―― 死link を一本づつ名指して仕分けよ★\n\n先に一言。km-124 は ★宣22:45 に対し實8分(0.24倍)★ で納め、しかも\n「179 は現 disk で門が落ちた数ではない」という ★問ひの前提そのものの誤り★ を突き止めた。\n仮の tree を mktemp に再現して verify.py を當て、179 を寸分違はず再現した手続きが良い。\n追ひ便⑦で己の記憶違ひ(着手22:12→箱の22:11:11)を自ら訂正した事も良い。★刻は箱から引け★ は正しい。\n\nさて ―― 貴席は今 ★context 100%★ である。本弾は ★前の文脈を要さぬ形★ に切つてある。\n自動の畳み込みが入つても、此の札だけで最初から走れる。\n\n■ 弾: 家老が以前に数へた ★死link 81件★ が、今も在るのか・何であるのか、一本づつ当てよ。\n\n㋐ ★己の器で数え直せ★。家老の「81」を出発点にするな ―― 別の刻の別の歩き根の数かも知れぬ。\n   repo 根 /Users/momizimac/multi-agent-shogun を歩き、★symlink であつて指す先が無い物★ を拾へ。\n   ⑴歩き根と深さと刻を紙の冒頭に書け ⑵母數(歩いた entry の総数・symlink の総数・死んで居る数)を書け\n   ⑶★己の数と家老の81が違つても直すな★ ―― 違ふ事と、違ふ理由(刻か・根か・定義か)を書け。\n   ★os.walk は followlinks=False・os.path.islink で判じ・os.path.exists は指す先を見る★ 事に注意せよ。\n   名に改行や空白を含む物が在り得る ―― ★find | wc -l の類で数へるな★(行単位の器は名で壊れる)。\n\n㋑ 一本づつ表にせよ。欄 = link の path / 指す先の逐語 / 先が絶対か相対か /\n   ★先が repo の中か外か★ / 先の親 dir は在るか / link 自身の mtime /\n   ★git の管理下か(git ls-files で当てよ)★ / 追跡外なら .gitignore に掛かるか。\n\n㋒ ★因で畳め★。類は貴殿が名付けよ。予め想ふ所を挙げるが ★之に縛られるな★:\n   ㋐先が消された ㋑先が他席の worktree(此の checkout に無いだけで、他所には在る)\n   ㋒先が /mnt/c 等 ★此の機に無い樹★ ㋓相対 path の基点違ひ ㋔作られた時から死んで居た。\n   ★各類の数の和が㋐の総数に一致する事を検算せよ★。一致せねば ★測れぬ★ と書いて差を残せ。\n\n㋓ ★害を測れ★。死link は「在るだけ」なら無害である。現に害が出るのは\n   ⑴門や照合器が其れを歩いて止まる ⑵臺帳に載つて居て實体無と鳴る ⑶git が追ふ、の三つ。\n   ★三つとも現に当てて数で示せ★ ―― 幾つの死link が docs/evidence の束の中に在り、\n   幾つが臺帳に載つて居るか。★0 なら 0 と書け★(零には陽性対照・歩き根と深さ・rc・刻 の四札)。\n\n㋔ 案は三つまで。⑴何もせぬ(現状維持)を ★必ず一案として数で評せよ ―― 之が既定★。\n   各案につき ★害(㋓の数)が幾つへ動くか★ と ★戻し方★ を書け。\n   ★消す案を出すなら、消す本数と、消した後に戻せるか否かを必ず書け。★\n   第一条: ★出所不明の物は「味方がやつてくれた」前提で調べる。消すな・戻すな・咎めるな。★\n   ∴ 本弾は ★一本も消さぬ★。調べて数へて案を書くだけである。\n\n㋕ 門 rc=0 を二走。控の名を紙に書け。cd 束 → append(第一引数=臺帳)、門は KM_GATE_MANIFEST_BASE=. 付。\n   ★出目を束の中へ tee で流すな★ ―― 貴殿が km-124 初走 rc=1 で踏んだ自己言及の病である。\n   ★死link を束の中に作るな★(試料が要るなら作つて良いが、臺帳に載せる前に己で始末せよ)。\n\n★禁★ commit・push・枝作り・refs への書込み 悉く禁。★一本も消すな・張り直すな★。\n     settings.json / hook / scripts/ の書換へ 悉く禁(変更統制)。\n     稼働中の watcher・他席の worktree 不触。束に空白を含む名の実体を置くな。\n     ★queue/ を丸ごと歩くな★ ―― 13.2GB 在り、器が時切れする(家老が実測して居る)。\n     歩