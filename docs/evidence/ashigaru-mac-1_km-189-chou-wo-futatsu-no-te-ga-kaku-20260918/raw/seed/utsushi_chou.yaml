  hon: "★出所 ―― 家老の掟の内、誰も数へて居らぬ第三の面である。★\n\n家老の掟に「rc を管を通して取るな」が在る(zsh の PIPESTATUS は★空★・${pipestatus[N]} が正)。\n併せて貴席は km-184 で `2>/dev/null` を 367 行/54 file と数へ、km-187 で `2>&1` を歩いて居る。\n∴ 同じ族に★第三の面★が在る ―― 「管の左の失敗が rc に出ぬ器」。\n是を★誰も数へて居らぬ★。km-188 は其の面を数へる弾である。★直さず・据ゑず・紙のみ。★\n\n㋐ census ―― repo(sh/py/bats)+ ~/bin(★家老の器を外すな★)を歩き、形ごとに件を数へよ:\n 形① `cmd | wc -l` / `cmd | grep -c ''` の類で左の rc が落ちる形\n 形② `$(cmd | …)` の中で左が失敗しても空が「0」として通る形\n 形③ `cmd | head -N` で SIGPIPE が rc を汚す形\n 形④ `set -o pipefail` が★無い★器と、在る器の別\n 形⑤ 管の後で `$?` を取る形(zsh は PIPESTATUS が空ゆえ黙つて右の rc に成る)\n根・深さ・除外・rc・刻・陽性対照を悉く書け。形が互ひに排他である事も示せ。\n★母數に家老の器(~/bin/* ・scripts/checks/karo_mac_*)を入れよ★ ――\n上役の器を母數から外すのは、数へぬ事と同じである。\n\n㋑ 件ごとに「載る/載らぬ/条件付」を判じよ。左が失敗し得ぬ形(定数 echo 等)は載らぬ側へ、★理由付きで★。\n判じ得ぬ件は「判じ得ぬ」と書いて数へよ ―― 0 に丸めるな。\n\n㋒ ★己の束で実射せよ★ ―― 左を必ず失敗させる種を置き、\n⒜ 素の管 ⒝ pipefail 有 ⒞ ${pipestatus[1]} を取る形 の三つで rc と数がどう違ふかを並べて書け。\n★偽の rc=0 を現に出して見せよ★。家老の掟が紙の上の言葉でなく路である事は、其の一枚で決まる。\n\n㋓ ★km-184 ㋓(2>/dev/null)と km-187 ㋐(2>&1)に重ねるな★。\n重なる件は「他弾で既に数へた」と註して母數から外し、★外した数を書け★(黙つて外すな)。\n\n㋔ 案(据ゑず・紙のみ)―― 件ごとに\n「rc を素で取る形へ直す」「pipefail を置く」「${pipestatus[N]} を読む」の孰れかを選び、選んだ理由を一行。\n★一律の直しを薦めるな★ ―― 読む器と数へる器で正解が違ふ。\n\n㋕ 測れぬ物を名指せ ―― /bin/sh の実体・Linux 側に zsh 無き件・走らせねば判らぬ件。\n\n㋖ 束= docs/evidence/ashigaru-mac-1_km-188-kuda-wo-tooshita-rc-20260918/。\n__pycache__ を束へ入れるな。門を二度 rc=0(cd の後に KM_GATE_MANIFEST_BASE=. を置け)。\nbyte和が二度同じ事を示せ。臺帳の根は★束内相対★。\n\n㋗ 枝= origin/main 6bde7170ce574090a6139ba2dfe3aa4cb6db8634 から★己の worktree★で切れ(1弾1枝)。\n共有樹の HEAD・index・他席の生きた樹には触れぬ。git add -f で名指し・commit --only・\n★reset を打つな・push せぬ・main を触るな・gh を叩くな★。\n\n㋘ ★km-187(宣ETA 20:40)が先★。km-188 は其の後。\n宣ETA を先に一便・胴は300字・便は分けよ(識別子を略すな)・監査は gunshi-mac へ parent 332455。\n"
