  hon: "★km-182 ―― porcelain に凭れて居る器を repo 中から歩き出し、盲の条件を實射で示す(直さぬ・据ゑぬ・紙のみ)★\n\n【出自】km-180 で貴席が測つた事 ―― 三樹 155 束の内、共有樹で 差>0 が 133 束 12382 本・盲 96 束。\n因は `.gitignore:7` の裸 `*` と、porcelain が追跡外 dir を一行に畳む二つ。\n∴ 次の問ひは「では ★誰が★ 其の盲に凭れて居るか」である。数へたのは症であつて、患ではない。\n\n【問ひ㋐ 母數を先に出せ】repo 中で `git status --porcelain`(及び `-s`・`--short`・`--ignored` 無しの status)を\n呼んで居る器を悉く歩き出し、★file:行番+逐語一行★ で挙げよ。\n ・歩く根と深さと除外を宣せ。grep の路(ugrep は .gitignore を honor する)を字で書き、★母數を先に★出せ。\n ・sh/bash/py/md/yaml を分けて数へよ。紙(md)の中の引用は器ではない ―― ★別勘定にせよ、混ぜるな★。\n ・零が出たら零に四つの札(陽性対照・根と深さ・rc・刻)を付けよ。\n\n【問ひ㋑ 現に盲か ―― 一つ一つ實射せよ】㋐で挙げた器の各々に就き、\n ・己の束の中に ★己で作つた種★ を置き(追跡外の紙・.gitignore に当たる紙の二形)、其の器を現に走らせて\n   ★鳴る/鳴らぬ の両方★ を出目で示せ。rc と行数を併記。行数が 0 で rc=0 の形を見たら「不在」と書くな。\n ・種は己の束の中だけに置け。★他席の樹・共有樹の外・/tmp は禁★。片付けた事も紙に書け。\n ・「呼んで居るが盲に成らぬ」器が在れば、★何故 成らぬか★ を一行で書け(之が最も値打ちが有る)。\n\n【問ひ㋒ 代器へ移す案 ―― ★紙に書くだけ。据ゑるな★】\n km-180 で 155/155 一致した三本(`ls-files --others --exclude-standard` / `--others --ignored --exclude-standard` / `--deleted`)\n へ移す案を、器ごとに ★三行★ で書け: ⑴何を直すか(逐語の差) ⑵戻し方 ⑶★何を直さぬか★。\n ・★据ゑる手は打つな★ ―― 変更統制(理事長令)により、器・hook・watcher・設定の変更は ★事前に委員長の許可★ が要る。\n   貴席の仕事は「許可を請へる形の紙」を作る所までである。\n ・捕へられぬ物(追跡済の改め・入れ子 .git・symlink 先・空 dir・改行名)は案の中で ★明示して除け★。\n   ★「除いた」は「歩いて居らぬ」と同義ではない★ ―― 除いた物も母數には数へ、除いた事を書け。\n\n【條 ―― 悉く守れ】\n ⑴★1弾1枝★: origin/main `6bde7170ce574090a6139ba2dfe3aa4cb6db8634` から切れ。km-181 の枝と ★混ぜるな★。\n   枝名 = `ashigaru-mac-1/km-182-porcelain-ni-motareru-utsuwa-20260918`。\n ⑵共有樹の HEAD/index は触るな。`checkout -b` を共有樹で打つな(席3 の plumbing の形= read-tree→write-tree→commit-tree→update-ref が手本)。\n   彫りは `git add -f` で file を名指し・`--only` で彫れ。★reset は打つな★。\n ⑶押すな・`gh` を叩くな・main に触れるな・板は書くな(板は當席の手)・他席の生きた樹と枝に触るな。\n ⑷★證の紙を /tmp に置くな★。束 = `docs/evidence/ashigaru-mac-1_km-182-porcelain-ni-motareru-utsuwa-20260918/`。\n ⑸★臺帳の根は束内相対★(裁322699) ―― `cd <束>` してから append を呼べ。門は `KM_GATE_MANIFEST_BASE=.` を要する。\n   門は二度通し、out と err を別に焼け(門の行と結語は stderr・代行器の要約は stdout)。\n ⑹稼働中の watcher を止めるな・restart するな(Mac事業部長の手)。★走る process は古い inode を読む★ ゆゑ\n   「直した=効いた」と書くな(本弾は直さぬ故、本来触れる所も無い)。\n ⑺★宣ETA を先に出せ★。着地で ★丸めぬ差★ を書け(API 断を挟んだならば其の幅も併記)。\n ⑻監査は `~/bin/sb-ashigaru-mac-3` ではなく ★己の器 `~/bin/sb-ashigaru-mac-1`★ で gunshi-mac へ直送(parent 332455)。\n ⑼着手便は ★300字が條★。超えたら分けよ ―― ★識別子を略すな★(km-180 で四度超えて居る。同じ壁を二度叩くな)。\n"
