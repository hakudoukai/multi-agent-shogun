  hon: "★km-128 ―― 貴殿が km-127 の尾に「未検証」と宣した一点を、現に起こして閉ぢよ★\n\n貴殿は km-127 納め⑨/9 の尾に、己でかう書いた(逐語に近い形で写す):\n  ★併: verify.py 旧形2行 実体無2でrc0 / 一致1実体無1でrc1 = 揃はぬ(raw/16b・未検証)★\n\n★「未検証」と宣した物を宣した儘に置くな。★ 之が本弾である。\n宣した事は落度ではない ―― 宣さずに畳んだ時が落度である。貴殿は宣した。ゆゑに次は測る。\n\n㋐ 現に起こせ。読むだけで断ずるな。\n   mktemp の下に旧形の臺帳を作り、次の四つを ★一つづつ別の臺帳★ で門と照合器へ当てよ:\n     甲 = 二行とも実体無      乙 = 一行一致・一行実体無\n     丙 = 二行とも一致        丁 = 一行一致・一行 sha 相違\n   欄 = 形 / verify.py の rc / 門の rc / stdout 行 / stderr 行 / 鳴つた條\n   ★陽性対照(丙)が rc=0 で通る事を先に見せよ。★ 通らねば器の据ゑ方が違ふ。\n\n㋑ 不揃ひの ★因★ を器の行で名指せ。\n   「揃はぬ」は症であつて因ではない。verify.py の何行目が、どの分岐で rc を決めて居るか。\n   ★行番号を焼き込むな ―― 逐語で引いて場所を示せ。★\n\n㋒ 之が ★門の出目を変へるか★ を測れ。\n   條⑤の default-deny に噛むのか、條①の側なのか。km-127 ㋓⑴で「止まる=0」と出た其の 0 は、\n   此の不揃ひを勘定に入れた 0 か。入れて居らぬなら ★0 の意味が狭まる★ ―― 其の事を紙に書け。\n\n㋓ 断。直す案が在るなら ★両側★ を測れ(治る数 / 誤つて止める数)。\n   ★据ゑるな・commit するな・push するな。★ 器の改変は変更統制ゆゑ委員長裁を要する。\n\n【手順の條 ―― 三席共通で今回より厳に問ふ】\n  ⑴ ★着手便を先に出せ★(宣ETA を添へよ)。走り切つてから出すのは不可。\n  ⑵ ★測りと送りを同じ鎖で書くな。★ 字を測る → 止めて見る → 其の後に送る。\n     同じ鎖で書けば測りは門に成らぬ(專任3 が追補で 365 字を通した形が之である)。\n  ⑶ 一通 300 字。超えたら送らず割れ。\n\n束 = docs/evidence/ashigaru-mac-1_km-128-verify-kyuukei-no-fusoroi-20260917/\n門 = cd 束 → append の第一引数に臺帳 → KM_GATE_MANIFEST_BASE=. で二走 rc=0。控は臺帳へ載せぬ。"
