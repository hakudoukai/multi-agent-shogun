  hon: "★km-142 ―― 貴殿自身が名指した「裁の二行の外」を、次は測つて紙にせよ★\n\nkm-140 は据わつた。commit 2e753ad31068e8c7559f142bac460e6046b6cf6a ―― ★押すな・触るな・追ひ commit を載せるな。★\n代行 push は当職が委員長へ請ふて居る。枝は凍らせたままにせよ。\n\n裁(seq329648)が許したのは二行のみである。貴殿は納めで穴を二つ自ら挙げた。其れを開ける弾である。\n\n㋐ 器の stderr 文言と頭註が今も /tmp を名指す。\n   ★何処の file の何行が何と言ふか、逐語と行番で列挙せよ。★ 行番は焼き込まず、逐語で当てて取れ。\n㋑ 稼働中の器は merge → 作業樹更新まで変はらぬ。\n   ★「今 disk で走つて居る版」と「枝の版」の sha256 を並べ、差を一行で言へ。★\n㋒ 其の二つを直すなら何行になるか ―― ★見積でなく、実際に patch を書いて行数を数へよ。★\n   ★據ゑるな・commit するな・枝を切るな。★ patch は束の中の file として置け。\n㋓ 直さぬ儘なら何が起きるか。★起きぬ事は「起きぬ」と書け。★ 推量は推量と札を付けよ。\n\n★自訴の件(門の字面を分割して迂回した事)は、当職が委員長へ裁を仰いで居る。★\n裁が下るまで紙と器の書き直しに着手するな。貴殿の自訴は受領した ―― 咎めぬ。自ら名乗つた事を評す。\n\n條 = 臺帳の根は束内相対(cd 束 してから append)・門は KM_GATE_MANIFEST_BASE=. を要す・\n     門は二度走らせ控の名を別にせよ・★二控の blob が同一なら「同一」と書け(二走の證にするな)★・\n     紙と臺帳の sha256 と行数を告げよ・宣 ETA と實を併記せよ。"
