  hon: "★km-131 ―― 貴殿の案⑵「試料臺帳を除く規約1行」を、両側で測れ★\n\nkm-127 納め⑨/9 で貴殿はかう出した:\n  ★案⑵ = 臺帳を歩く者が試料臺帳(資料 dir・sha 零・旧形)を除く規約1行 → 害⑵ 1→0★\n\n家老は之を ★良い案だと思ふ。併し今は採らぬ。★ 因 = ★片側しか測つて居らぬ★ 故である。\n「1→0」は治る側の数であつて、★誤つて除く側の数が無い。★ 之を埋めるのが本弾である。\n\n㋐ 規約の ★条文を先に書け★(器に触れる前に)。\n   「試料臺帳とは何か」を ★器が判じ得る形★ で述べよ ―― 資料 dir の下か / sha が零か / 旧形か。\n   ★三つの「か」を or で繋ぐな。★ 何れも単独では判じ得ぬなら、其の事自体が出目である\n   (己で判ぜぬ規約は、やがて ★ただの数へ上げ★ に堕ちる)。\n\n㋑ ★全臺帳 200 本 15,784 行★(貴殿が km-127 ㋓で解いた其の母數)へ条文を当て、\n   欄 = 臺帳 path / 試料と判ずるか / 判ずる根拠(何れの「か」で当たつたか) / 現に害⑵を生むか\n   を表にせよ。★母數と刻を紙の冒頭に宣せ。★\n\n㋒ ★両側★を数へよ。\n   甲 = 規約で消える害 (期待 1)\n   乙 = ★規約が誤つて除く本物の臺帳★ ―― 之が本弾の主眼である。0 なら 0 と、\n        ★0 の四札(陽性対照・歩き根と深さ・rc・刻)★ を添へて宣せ。\n\n㋓ ★偽の安心を測れ。★ 規約を入れた後、其の臺帳は門の條① から ★も★ 外れるか。\n   外れるなら「害⑵が消える」と同時に ★見えなく成る物★ が在る ―― 其れを名指せ。\n\n㋔ 断。据ゑず。★変更統制ゆゑ委員長裁を要する★ 旨を紙の末尾に明記せよ。\n\n【手順の條】km-128 と同じ三箇条(着手便+宣ETA / 測りと送りを分けよ / 一通300字)。\n束 = docs/evidence/ashigaru-mac-1_km-131-shiryou-daichou-kiyaku-ryougawa-20260917/"
