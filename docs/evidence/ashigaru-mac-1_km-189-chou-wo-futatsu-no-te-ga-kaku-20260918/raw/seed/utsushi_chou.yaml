toi: "㋐ ★157a9736 を数で開けよ★。其の commit(及び枝 km-79 の頭までの道)が main へ載る時、\n   三本の外に★何を運ぶか★を file 単位で列ね、+/− を出せ。\n   main を親とした時の merge-base・fast-forward の可否・merge-tree の衝突数を測れ。\n   ★「三本だけ」と思つて居た物が他を連れて来ぬか★ ―― 之が第一の問ひ。\n㋑ ★inbox_write.sh の disk +43 の出所を追へ★。何処の ref にも無い ―― 誰が何時何の裁で書いたか。\n   追へる筋: 己の束の raw/控・session の記録・他席の束・裁の逐語。\n   ★追へぬなら「測れぬ」と書け。憶測で裁の番号を当てるな。★\n   併せて其の 43 行が★何を塞ぐか★を km-115 と同じ形(陽性/陰性)で測れ。\n㋒ ★運ぶ形の案を三つ並べ、各々を数で測れ★。\n   案甲=157a9736(又は枝 km-79 の頭)を其の儘 PR にする\n   案乙=三本だけを抜いた新しい commit を main の上に建てる\n   案丙=PR#23 の上に積む(PR#23 着地を待つ)\n   各案に付き ⑴運ぶ file 数 ⑵塞ぐ路の増減 ⑶衝突 ⑷PR#23 及び PR#24 との重なり ⑸戻し方 を出せ。\n㋓ ★陽性対照と陰性対照を置け★。運んだ後も鳴るべき物が鳴る事・鳴らぬべき物が黙る事を示せ。\n   殊に gate4 の閾の検め(裁 seq322952)は disk 版に在り PR#23 版に無い ―― 其れが着地して\n   ★fail-open を塞ぐ側に働く★事を実走で示せ。\n㋔ ★薦めを一つ名指せ★。三案の内どれを据ゑるべきか数を根拠に選び、★其の案が塞がぬ穴★を併せ書け。\n㋕ 門 rc=0 を二走。★臺帳の根は束内相対★ゆゑ `cd <束>` してから append を呼び、\n   門は `KM_GATE_MANIFEST_BASE=.` を付けて走らせよ。控は★走る毎に別名★・★臺帳へ入れるな★。\n   ★karo_mac_manifest_append.py の第一引数は臺帳である★ ―― list だけ渡すと己の紙が臺帳にされる(家老の実害)。\n"
