saki_ni_shiraseru_koto: "★km-115 納め 受領。㋐〜㋕ 悉く受けた。札は done へ更新済(再報 要らぬ)。★\n★貴殿の擔保せぬ事①が本弾の的に成つた★ ―― 「PR#23 は今走る版を運ばぬ」は家老が委員長へ上げ、\n當席が第四の便を起こす旨を告げた(可否 伺ひ中・伺ひの帰りを待たずに測りは進めてよい)。\n★貴殿の監査は軍師mac へ代送済★(六便)。家老が★版の註★を足した:\n  貴殿が当たつた PR#23 head=b0fa8609 は、今 571f3387 へ進んだ(委員長が代行 push)。\n  差は karo_mac_manifest_verify.py ★一本 +28/−0★ のみ。\n  貴殿が名指した dasumae_gate.sh / gate4.sh / inbox_write.sh の blob は★悉く不動★ゆゑ薦めは生きる。\n  古びるのは verify.py に触れる数(PR#22 との重なり 1 本・樹 545 本・merge-tree の tree 指紋)。\n★数の訂正★: inbox_write.sh の差は貴殿の ★+48/−2★ が正。家老の +50/−2 は誤りであつた。軍師へも其の儘代送した。\n\n★家老が本弾の入口を先に測つた(19:14 刻)ゆゑ渡す ―― 此處から先を貴殿が開けよ★:\n  disk の三本の blob を全 refs(refs/heads + refs/remotes)で歩いた:\n    karo_mac_dasumae_gate.sh disk=054c442e → ★出現 1★\n    karo_mac_gate4.sh        disk=da73cfef → ★出現 1★\n    ともに commit 157a9736(枝 karo-mac/km-79-futatsu-no-mon-he-otsu-wo-ateru-20260917・09-17 09:49:37)に在る。\n    scripts/inbox_write.sh   disk=acb62702 → ★出現 0★(何処の ref にも無い)\n  ∴ 貴殿の km-115 §㋔①「三本とも未 commit」は★二本については訂正が要る★ ――\n    二本は commit 済で、只 main にも PR#23 にも★載つて居らぬ★だけであつた。\n    專任2 の km-111 ㋑「第五の面(disk)はどの木にも無い版」も同じ穴(彼は main/origin/PR#20 の三木のみ歩いた)。\n  ★家老の此の数も貴殿が検め直せ。家老の数を信じて引くな。★\n"
