  hon: "【km-180 ★彫られぬ證の紙を器で必ず捕へる ―― 測るのみ・据ゑぬ★】(家老mac発・板外=裁332455)\n\n◆因(當席が今日 現に踏んだ穴):\n席3 の km-175 束で、disk 248本 に対し彫りの tree は 234本 ―― ★14本が彫られぬ儘 disk にのみ在つた★。\n然るに `git status --porcelain -- <束>` は ★一行も出さぬ★。.gitignore:7 の裸 * が悉く伏せる故である\n(check-ignore -v で三本を名指して確かめた・rc=0)。\n∴ ★「porcelain が0行ゆゑ未commit無し」は偽の證である。★ 之を器で捕へる形を貴殿が作れ。\n★直すな・据ゑるな(hook も門も settings も触るな=変更統制)。測つて紙に書くまでが本弾である。★\n\n◆㋐ 先に己の樹の身元を書け ―― ★同じ問ひが樹ごとに違ふ答を出す★\ngit rev-parse --show-toplevel / git rev-parse HEAD(40桁) / 枝名 / 刻。\n當席は共有樹で測つた故、貴殿の樹の数と違ひ得る。★違へば其れ自体が成果であつて食ひ違ひではない。★\n\n◆㋑ 母數と歩き根を宣せ\n根 = docs/evidence ★のみ★。★queue/ を歩くな(13.2GB・過去に時限切れを起こして居る)★。深さを書け。\n當席の共有樹での實測: docs/evidence 直下の dir = 151。貴殿の樹の数を己で数へて書け。\n\n◆㋒ 束ごとに三つの数を出せ\n⑴ disk 實数 = find <束> -type f の本数\n⑵ 追跡数 = git ls-files -- <束> の行数\n⑶ 差 = ⑴−⑵(負なら「disk に無く追跡に在る」=別の症ゆゑ分けて書け)\n差≠0 の束を悉く列ね(束名は畳まず・prefix は束名で始まる)、合計本数と合計束数を書け。0 なら零の四つの札。\n\n◆㋓ ★porcelain の盲を實射で示せ(二方向)★\n差>0 の束を一つ選び:\n ⒜ git status --porcelain -- <束> の行数(0 行なら偽の「未commit無し」= 濡れ衣ではなく黙り)\n ⒝ git check-ignore -v で伏せた規則の行を逐語で名指す(rc も書け)\n ⒞ ★陰性対照★: .gitignore に伏せられぬ path(例 tracked な紙を一字直した物)では porcelain が鳴る事を一度示せ。\n   ★但し他席の紙は一字も直すな。己の束の内に己で作つた紙で示せ(作つた事を紙に書け)。★\n\n◆㋔ 代はりの器を一つ提案せよ(★紙に書くのみ・据ゑるな★)\n候補 git ls-files --others --ignored --exclude-standard -- <束> 等を己で選び、rc・母數・find との差を出せ。\n「之で捕へられる物/捕へられぬ物」を両方書け。★捕へられぬ物を書かぬ提案は受けぬ。★\n\n◆㋕ 対照\n陽性対照 = 貴殿の km-176 束(差が在るか無いかを己で測れ・在ると決めて掛かるな)。\n陰性対照 = 差0 の束を一つ名指せ。無ければ「★差0 の束は無い★」と宣せ(之も成果)。\n\n◆㋖ 零には四つの札(rc・根と深さ・刻・検出子自身の対照)。★母數まで0なら器の疵を先に疑へ。★\n\n◆境(踏むな):\n・押すな・gh を叩くな・main 不触・他席の枝と生きた樹に触るな・板は書くな(★板は家老の手★)。\n・★裁333060⑶=1弾1枝★ ―― 彫る物が出たら origin/main 6bde7170ce574090a6139ba2dfe3aa4cb6db8634 から己の新枝を切れ。\n・臺帳の根は束内相対(cd <束> してから karo_mac_manifest_append.py・門は KM_GATE_MANIFEST_BASE=. を要する)。\n・commit は git add -f で名指し・★--only で彫り reset は打つな★。★證の紙を /tmp に置くな★。\n・門は二度走らせ、控は走ごとに別名で焼け(out と err の両方を読め)。\n・監査は己の器 sb-ashigaru-mac-1 で軍師mac へ直送(parent_seq 332455)・固定 commit を必ず書け(裁333060⑵)。\n・宣ETA を先に出し、後で★丸めぬ差★を書け。"
